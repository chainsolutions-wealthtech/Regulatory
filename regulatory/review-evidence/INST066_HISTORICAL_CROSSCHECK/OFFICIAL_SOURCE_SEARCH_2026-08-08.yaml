source_id: INSTRUCTION_66_CREPMF_2021
source_article: 92
purpose: >-
  Identifier des publications ou binaires institutionnels pour les sept textes
  explicitement abrogés par l'article 92 de l'Instruction n°66/CREPMF/2021, afin
  de constituer une chaîne historique vérifiable sans réactiver les anciennes règles.

primary_source_basis:
  inventory: regulatory/registries/INST066_ABROGATED_TEXTS_INVENTORY_V0_1.yaml
  source_pdf: regulatory/materialized/INSTRUCTION_66_CREPMF_2021.pdf
  source_sha256: 3f964f2f6ab9ce9eb16912ccda13f34b5023a188dfb18fcba7065590c770d396
  article_92_reference_count: 7

institutional_routes_checked:
  - authority: BRVM
    route: https://www.brvm.org/fr/node/315
    scope: >-
      Bibliothèque paginée « Instructions, circulaires et autres textes publiés par
      l'AMF-UMOA », pages historiques 6 à 9 examinées jusqu'aux publications de 1999.
    result: >-
      Une publication institutionnelle distincte de l'Instruction n°46/2011 révisée
      a été identifiée via la BRVM. Les anciennes Instructions CREPMF n°21/99,
      n°22/99, n°23/99, n°24/99 et n°45/2011 ainsi que la Décision n°2012-119
      n'ont pas été identifiées sous ces références dans les pages historiques parcourues.
    interpretation_boundary: >-
      L'absence de ces références dans la bibliothèque BRVM parcourue n'est pas une
      preuve de non-publication ou d'absence juridique ; elle signifie uniquement
      qu'aucune route exploitable n'a été identifiée dans ce périmètre.

  - authority: BRVM_AND_AMF_UMOA
    scope: EXACT_REFERENCE_AND_TITLE_SEARCHES
    result: >-
      Des recherches ciblées sur les numéros et intitulés complets des six références
      restantes n'ont pas fourni de route institutionnelle publique exploitable dans
      le périmètre indexé contrôlé le 2026-08-08.

