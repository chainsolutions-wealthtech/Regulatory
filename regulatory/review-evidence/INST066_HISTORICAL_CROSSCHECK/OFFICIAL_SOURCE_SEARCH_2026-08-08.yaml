  article_92_reference_count: 7

institutional_routes_checked:
  - authority: BRVM
    route: https://www.brvm.org/fr/node/315
    scope: >-
      Bibliothèque paginée « Instructions, circulaires et autres textes publiés par
      l'AMF-UMOA », pages historiques 6 à 9 examinées jusqu'aux publications de 1999.
    result: >-
      La publication institutionnelle de l'Instruction n°46/2011 révisée a été
      identifiée puis son binaire matérialisé. Les anciennes Instructions n°21/99,
      n°22/99, n°23/99, n°24/99 et n°45/2011 ainsi que la Décision n°2012-119
      n'ont pas été identifiées sous leurs propres références dans ces pages.
    interpretation_boundary: >-
      L'absence de leurs actes propres dans la bibliothèque parcourue n'est pas une
      preuve de non-publication ou d'absence juridique.

  - authority: BRVM_AND_AMF_UMOA
    scope: EXACT_REFERENCE_AND_TITLE_SEARCHES
    result: >-
      Des recherches ciblées sur les numéros et intitulés complets n'ont pas fourni
      de binaire propre exploitable pour les six références restant à matérialiser.

  - authority: CREPMF_VIA_BRVM
    route: https://www.brvm.org/fr/crepmf-agrement-du-fonds-commun-de-placement-fcp-nsia-fonds-diversifie-en-qualite-dopcvm-sur-le
    evidence_role: OFFICIAL_ADMINISTRATIVE_CORROBORATION_ONLY_NOT_NORMATIVE_SUBSTITUTE
    decision_reference: "PCR/DA/2018/165"
    repository_copy: regulatory/review-evidence/INST066_HISTORICAL_CROSSCHECK/corroborating/DECISION_PCR_DA_2018_165_NSIA_FONDS_DIVERSIFIE.pdf
    sha256: 282b603d99e80699203c4ca75abc683dee8e550f2a8f6f79eccd7e937b0c7337
    page_count: 4
    observations:
      - "Le visa cite explicitement l'Instruction n°24/99 et son objet relatif à la note d'information des OPCVM."
      - "Le visa cite explicitement l'Instruction n°45/2011 et son objet relatif à l'organisation, au fonctionnement et à la gestion des OPCVM."
      - "Le visa cite explicitement l'Instruction n°46/2011 et son objet relatif à la classification et aux règles d'allocation d'actifs."
      - "La Décision n°2012-119 et les Instructions n°23/99, n°22/99 et n°21/99 ne sont pas observées dans cet acte."
    interpretation_boundary: >-
      Cette décision officielle postérieure corrobore les références et intitulés des
      textes qu'elle cite mais ne remplace pas leurs actes normatifs et ne permet pas
      de reconstruire automatiquement leurs obligations, dates ou versions.

