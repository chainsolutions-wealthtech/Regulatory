source_article: 92
purpose: >-
  Identifier des publications, binaires ou preuves institutionnelles pour les sept
  textes explicitement abrogés par l'article 92 de l'Instruction n°66/CREPMF/2021,
  afin de constituer une chaîne historique vérifiable sans réactiver les anciennes règles.

