  conclusion: >-
    Le scan borné de l'API officielle AMF-UMOA retrouve exactement dix objets de
    catégorie Décision, soit le même nombre que le registre public courant, et valide
    trois témoins connus. Aucun objet ne porte la référence CM/10/06/2022. Le seul
    objet dont l'intitulé porte sur les sanctions pécuniaires est la Décision 2016.

institutional_cross_evidence:
  bceao_2022_adoption: >-
    La BCEAO confirme que le Conseil des Ministres a adopté le 24 juin 2022 un
    dispositif révisé des sanctions pécuniaires applicables au marché financier régional.
  centif_exact_reference: >-
    La CENTIF Sénégal référence explicitement la Décision n° CM/10/06/2022 relative
    à la mise en œuvre du dispositif des sanctions pécuniaires.
  combined_interpretation: >-
    L'absence de la Décision CM/10/06/2022 dans le catalogue API courant ne vaut pas
    preuve d'inexistence, d'abrogation ou d'inapplicabilité, car son adoption et sa
    référence sont attestées par d'autres autorités publiques. Elle établit seulement
    que le binaire n'est pas exposé comme l'un des dix objets Décision de l'API
    officielle actuelle dans la plage contrôlée.

