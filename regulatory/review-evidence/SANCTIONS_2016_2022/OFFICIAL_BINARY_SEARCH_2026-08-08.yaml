scope: >-
  Recherche documentaire ciblée visant à établir la chaîne officielle des Décisions
  n° CM/SJ/O01/03/2016 et n° CM/10/06/2022 relatives au dispositif des sanctions
  pécuniaires sur le Marché Financier Régional de l'UMOA, à matérialiser leurs
  binaires et à déterminer leur relation juridique avant toute activation de barème.

