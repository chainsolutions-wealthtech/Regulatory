    La décision 2016 est désormais acquise intégralement. Le texte 2022 reste absent
    du corpus binaire. Le terme "dispositif révisé" et l'existence d'une nouvelle
    décision de même objet ne suffisent pas à déterminer sans le texte propre s'il
    s'agit d'un remplacement, d'une modification, d'une abrogation totale ou
    partielle, ou d'un régime comportant des dispositions transitoires.
