conclusion: >-
  La recherche du 2026-08-08 a désormais fermé l'acquisition documentaire de la
  Décision 2016 et confirmé par deux sources institutionnelles distinctes l'adoption,
  la date, la référence et l'objet de la Décision 2022. Le seul verrou documentaire
  principal de R1 est maintenant le binaire de CM/10/06/2022. Tant qu'il manque, la
  relation juridique 2016↔2022 et les barèmes de sanctions restent inactifs.
