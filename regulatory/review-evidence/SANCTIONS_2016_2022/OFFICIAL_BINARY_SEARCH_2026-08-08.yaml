evidence_id: SANCTIONS_2016_2022_OFFICIAL_BINARY_SEARCH_2026_08_08
review_date: 2026-08-08
scope: >-
  Recherche documentaire ciblée visant à identifier des binaires officiels stables
  pour la Décision n° CM/SJ/O01/03/2016 et la Décision n° CM/10/06/2022 relatives
  au dispositif des sanctions pécuniaires sur le Marché Financier Régional de l'UMOA.

sources_checked:
  - authority: AMF_UMOA
    source_type: CURRENT_REGULATORY_DECISION_INDEX
    url: https://www.amf-umoa.org/reglementation/decision
    observations:
      - "La Décision n° CM/SJ/O01/03/2016 est listée sous son intitulé sanctions pécuniaires."
      - "Le statut affiché pour l'entrée 2016 est NON ABROGE."
      - "La table publique observée contient plusieurs décisions de 2022, mais l'entrée CM/10/06/2022 n'y a pas été identifiée lors du contrôle du 2026-08-08."
    binary_identified: false
    interpretation_boundary: >-
      L'absence d'une entrée CM/10/06/2022 dans la table publique observée ne constitue
      pas une preuve d'absence, d'abrogation, de non-publication ou d'inapplicabilité.

  - authority: AMF_UMOA
    source_type: OFFICIAL_2016_DETAIL_PAGE
    url: https://www.amf-umoa.org/actuality-details?actualiteId=1000179
    observations:
      - "La fiche officielle porte la référence CM/SJ/O01/03/2016."
      - "La fiche affiche la date du 24 mars 2016."
      - "Le contenu publiquement indexé expose une image mais aucune URL binaire PDF stable n'a été identifiée dans le périmètre de recherche disponible."
    binary_identified: false

  - authority: AMF_UMOA
    source_type: CURRENT_LEGAL_FRAMEWORK_PAGE
    url: https://www.amf-umoa.org/reglementation/organisation
    observations:
      - >-
        La page de cadre légal cite parmi les textes postérieurs applicables une
        Décision du Conseil des Ministres relative au dispositif des sanctions
        pécuniaires applicable sur le Marché Financier Régional.
    binary_identified: false
    interpretation_boundary: >-
      Cette mention générique ne permet pas, à elle seule, d'identifier la version
      juridiquement applicable entre les textes 2016 et 2022.

  - authority: BCEAO
    source_type: OFFICIAL_COUNCIL_OF_MINISTERS_COMMUNIQUE
    url: https://www.bceao.int/fr/communique-presse/communique-de-presse-de-la-session-ordinaire-du-conseil-des-ministres-de-lunion-5
    observations:
      - "La session officielle s'est tenue le 24 juin 2022."
      - >-
        Au titre du CREPMF, le Conseil des Ministres a adopté un dispositif révisé
        des sanctions pécuniaires applicables sur le marché financier régional de
        l'UMOA.
      - >-
        Le communiqué précise que cette révision vise notamment l'alignement, pour
        les mêmes agissements, sur la Loi Uniforme relative aux infractions boursières
        et l'adaptation aux évolutions nécessaires du cadre de régulation.
    binary_identified: false
    evidence_scope: OFFICIAL_ADOPTION_AND_REVISION_PURPOSE_CONFIRMED

  - authority: CENTIF_SENEGAL
    source_type: PUBLIC_AUTHORITY_COMMUNITY_REGULATION_PAGE
    url: https://www.centif.sn/reglementation/fr/reglcommu
    observations:
      - >-
        La page référence explicitement la DECISION n° CM / 10 / 06 / 2022 du
        Conseil des Ministres de l'Union Monétaire Ouest Africaine relative à la
        mise en œuvre du dispositif des sanctions pécuniaires applicables sur le
        marché financier régional de l'UMOA.
    binary_identified: false
    evidence_scope: REFERENCE_AND_TITLE_CORROBORATED

search_result:
  decision_2016:
    source_id: DECISION_CM_SJ_001_03_2016
    official_registry_record: CONFIRMED
    official_detail_page: CONFIRMED
    registry_status_observed: NON_ABROGE
    official_binary_status: OFFICIAL_BINARY_NOT_MATERIALIZED

  decision_2022:
    source_id: DECISION_CM_10_06_2022
    official_adoption_of_revised_device: CONFIRMED
    exact_reference_from_public_authority_source: CORROBORATED
    current_amf_decision_table_entry: NOT_IDENTIFIED_IN_OBSERVED_PUBLIC_TABLE
    official_binary_status: OFFICIAL_BINARY_NOT_MATERIALIZED

relationship_status:
  value: REVISED_DEVICE_CONFIRMED_RELATIONSHIP_NOT_LEGALLY_CONCLUDED
  prohibited_inferences:
    - DO_NOT_INFER_TOTAL_ABROGATION
    - DO_NOT_INFER_PARTIAL_ABROGATION
    - DO_NOT_INFER_REPLACEMENT
    - DO_NOT_INFER_COEXISTENCE
    - DO_NOT_INFER_EFFECTIVE_DATE_OF_2022_DECISION
    - DO_NOT_INFER_SANCTION_AMOUNTS_OR_RANGES
  required_next_evidence:
    - OFFICIAL_BINARY_2016
    - OFFICIAL_BINARY_2022
    - OFFICIAL_EFFECTIVE_DATE_AND_TRANSITION_CLAUSES
    - HUMAN_LEGAL_COMPARISON_2016_VS_2022
    - HUMAN_COMPLIANCE_REVIEW

third_party_source_policy:
  normative_use_allowed: false
  note: >-
    Des copies tierces éventuellement accessibles ne doivent pas être matérialisées
    comme sources normatives ni utilisées pour activer des montants, barèmes,
    catégories de manquements ou effets juridiques. Elles peuvent au plus servir de
    piste de recherche vers une source officielle.

safety:
  atomization_allowed: false
  requirement_activation_allowed: false
  sanction_amount_calculation_allowed: false
  automatic_enforcement_allowed: false
  ready_for_submission_must_remain_false: true

conclusion: >-
  Le contrôle public du 2026-08-08 confirme l'existence officielle du texte 2016,
  l'adoption officielle d'un dispositif révisé en 2022 et la référence CM/10/06/2022
  via une source d'autorité publique. Il n'a pas permis d'identifier, dans les routes
  officielles publiquement indexées contrôlées, les binaires normatifs nécessaires.
  La matérialisation et l'atomisation restent donc bloquées sans substitution par une
  copie tierce.
