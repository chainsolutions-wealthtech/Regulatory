bceao_revision_link:
  observation: >-
    Le communiqué officiel BCEAO de la session du 24 juin 2022 indique que la
    révision du dispositif des sanctions pécuniaires vise notamment l'alignement,
    pour les mêmes agissements, sur la Loi Uniforme relative aux infractions
    boursières et l'adaptation aux évolutions du cadre de régulation.
  implication: >-
    La Décision 2021 est donc une pièce normative de contexte nécessaire à la
    comparaison 2016↔2022. Elle ne permet toutefois pas de déduire seule les effets
    juridiques précis de la Décision 2022 sur le dispositif 2016.

