  scope:
    article_2: "champ incluant expressément les OPC"
    article_14: >-
      Le Conseil Régional dispose d'un délai maximum de trois (3) mois à compter du
      dépôt de la demande pour se prononcer sur la demande d'agrément et rendre sa décision.
    article_15: >-
      Les décisions d'agrément/approbation, d'ajournement ou de rejet/refus font
      l'objet d'une notification au requérant selon les modalités décrites.
  limitation: >-
    L'article 14 fixe le délai maximal pour prendre/rendre la décision. L'article 15
