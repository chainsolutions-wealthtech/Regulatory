observations:
  - >-
    The current AMF-UMOA public portal exposes a Circulaires & Avis register and
    the public site category count observed on 2026-08-08 reports 39 circulars.
  - >-
    Exact and close public web searches did not identify an official indexed text
    whose title/content can safely close any of the nine residual dependencies.
  - >-
    The materialized 2022 corpus contains 16 circulars and has already resolved
    25 of the 34 circular occurrences through exact content comparison.
  - >-
    Circular 08 is not automatically mapped to Articles 75 and 76 because those
    provisions concern annual reports adopted by employee-savings supervisory
    councils, a distinct object from general OPC periodic reporting.
  - >-
    Circular 04 is not automatically mapped to INST066_ART021_DEP_CIRC_01 because
    its detailed depositary duties do not establish the exact content of the annual
    depositary report referred to by that dependency.
  - >-
    Search results from French/EU law or third-party copies were deliberately not
    used as normative evidence for UMOA dependency resolution.
