full_text_crosschecks:
  circulaire_04_2022:
    repository_text: regulatory/sources/amf-umoa-2022-circulars/CIRCULAIRE_04_AMF_UMOA_2022.txt
    subject: CONTRAT_ET_MISSIONS_DU_DEPOSITAIRE
    instruction_66_reference: true
    contains_rapport_annuel_phrase: false
    result_for_art021_annual_report: NO_EXACT_MATCH
    note: >-
      Le texte détaille contrat, garde, suivi des liquidités, surveillance, délégation
      de conservation, ségrégation, responsabilité et indépendance du Dépositaire,
      mais le contrôle du texte n'identifie pas le contenu du rapport annuel du
      Dépositaire visé séparément par l'article 21 de l'Instruction 66.
  circulaire_08_2022:
    repository_text: regulatory/sources/amf-umoa-2022-circulars/CIRCULAIRE_08_AMF_UMOA_2022.txt
    subject: RAPPORTS_PERIODIQUES_DES_OPC
    instruction_66_article_37_cross_reference: true
    contains_conseil_de_surveillance_phrase: false
    result_for_art075_art076_supervisory_board_reports: NO_EXACT_MATCH
    note: >-
      La Circulaire 08 précise les rapports annuels, semestriels et trimestriels de
      l'OPC, avec renvoi explicite à l'article 37. Elle ne précise pas le rapport annuel
      du Conseil de Surveillance des FCPE/SICAVAS visé aux articles 75 et 76.
  circulaire_03_2022:
    repository_text: regulatory/sources/amf-umoa-2022-circulars/CIRCULAIRE_03_AMF_UMOA_2022.txt
    subject: AGREMENT_MODIFICATION_ENREGISTREMENT_OPC
    explicit_instruction_66_articles: [17, 25, 55]
    fusion_dossier_present: true
    general_holder_information_section_present: true
    annex_iv_subject: INFORMATIONS_A_FOURNIR_LORS_D_UNE_FUSION_TO_REGULATOR
    annex_vi_subject: MODIFICATIONS_REQUIRING_INFORMATION_TO_HOLDERS_AND_FEE_FREE_EXIT
    explicit_article_59_cross_reference: false
    exact_article_59_investor_information_content_form_mode: false
    result_for_art059: RELATED_NOT_EXACT
    note: >-
      C03 traite le dossier de fusion soumis au Conseil Régional et indique les formes
      générales d'information des porteurs en cas de modification. L'article 59 de
      l'Instruction 66 délègue toutefois le contenu détaillé, la forme et le mode de
      fourniture des informations propres à la fusion aux investisseurs. C03 ne se
      présente pas comme le texte d'application de l'article 59 et ne doit pas être
      promue automatiquement pour ce renvoi.
  circulaire_02_2022:
    repository_text: regulatory/sources/amf-umoa-2022-circulars/CIRCULAIRE_02_AMF_UMOA_2022.txt
    subject: AGREMENT_MODIFICATION_RETRAIT_AGREMENT_SGO
    contains_services_auxiliaires_phrase: false
    exact_auxiliary_services_limits: false
    result_for_art004: NO_EXACT_MATCH
    note: >-
      Le programme d'activités décrit les services et activités de la SGO, mais ne fixe
      pas les limites dans lesquelles les services auxiliaires de l'article 4 peuvent
      être fournis.
  circulaire_16_2022:
    repository_text: regulatory/sources/amf-umoa-2022-circulars/CIRCULAIRE_16_AMF_UMOA_2022.txt
    subject: CONFLITS_D_INTERETS_ET_REGLES_DE_CONDUITE
    contains_delegation_phrase: false
    contains_boite_aux_lettres_phrase: false
    result_for_art014: NO_EXACT_MATCH
    note: >-
      Le texte contient des obligations de conduite et de gestion des relations avec
      des tiers mais n'énonce pas les conditions de délégation de l'article 14 ni le
      critère de société « boîte aux lettres ».

