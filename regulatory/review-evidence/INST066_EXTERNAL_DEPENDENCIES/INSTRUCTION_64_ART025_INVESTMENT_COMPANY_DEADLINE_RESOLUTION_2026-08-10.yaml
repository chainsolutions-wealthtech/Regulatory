scope_comparison:
  instruction_64_article_1: >-
    L'Instruction fixe les règles en matière de processus d'agrément et d'approbation
    des acteurs du marché financier régional.
  instruction_64_article_2: >-
    Le champ d'application inclut expressément les Organismes de Placement Collectif
    (OPC), ainsi que toute autre entité devant être agréée ou approuvée par le Conseil Régional.
  instruction_64_article_3: >-
    La décision du Conseil Régional intervient dans un délai maximum de trois (3) mois
    à compter de la date de dépôt du dossier.
  instruction_64_article_14: >-
    Le Conseil Régional dispose d'un délai maximum de trois (3) mois à compter du
    dépôt de la demande pour se prononcer sur la demande d'agrément et rendre sa décision.
  comparison_result: EXACT_IMPLEMENTING_SCOPE_MATCH
  rationale: >-
    L'article 25 de l'Instruction 66 renvoie à une Instruction pour les délais
    d'agrément des Sociétés d'Investissement. L'article 1 de l'Instruction 66 qualifie
    expressément ces Sociétés d'Investissement d'OPC. Instruction 64 s'applique
    expressément aux OPC et fixe le délai maximal de décision d'agrément. Il n'est
    donc pas nécessaire d'inférer une extension de catégorie : le rattachement OPC
    provient du texte source lui-même.

