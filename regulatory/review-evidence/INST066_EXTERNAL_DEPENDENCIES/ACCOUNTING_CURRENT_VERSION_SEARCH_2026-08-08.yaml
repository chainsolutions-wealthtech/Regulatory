interpretation_boundary: >-
  L'absence d'un acte postérieur dans les sources publiquement indexées contrôlées
  ne prouve pas que le Règlement 09/2006 n'a jamais été modifié, remplacé ou complété.
  Le chantier de révision annoncé par l'AMF-UMOA en 2023 ne constitue pas, à lui seul,
  une preuve d'adoption d'une nouvelle version. Le statut courant demeure donc ouvert.

