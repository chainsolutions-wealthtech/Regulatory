established_official_facts:
  - >-
    Le Secrétariat Général du Gouvernement du Mali liste officiellement le
    Règlement n°09/2006/CM/UEMOA du 29 juin 2006 portant adoption de règles
    comptables spécifiques applicables aux intervenants agréés du marché financier régional.
  - >-
    La BCEAO confirme officiellement que le Conseil des Ministres a adopté le
    29 juin 2006 les règles comptables spécifiques applicables aux intervenants agréés.
  - >-
    L'AMF-UMOA a indiqué en 2023 qu'un référentiel comptable spécifique existait
    depuis plus de dix ans et qu'un chantier de révision avait été engagé afin de
    prendre en compte les évolutions réglementaires, institutionnelles et comptables.

