scope_comparison:
  instruction_54_title_scope: >-
    Modalités de facturation, de paiement et de recouvrement des redevances, frais
    et commissions perçus par le Conseil Régional.
  implementing_section: "TITRE VI : FRAIS POUR HABILITATION, AGRÉMENT ET APPROBATION"
  article_18_effect: >-
    Les frais pour habilitation, agrément et approbation sont dus au titre de la
    délivrance des habilitations, agréments ou approbations. Ils sont exigibles dans
    un délai de quinze (15) jours calendaires à compter de la date d'envoi de la facture.
  article_19_effect: >-
    Les redevables disposent d'un délai maximum de quinze (15) jours calendaires à
    compter de la date d'envoi de leur facture pour effectuer le paiement de ces frais.
  comparison_result: EXACT_IMPLEMENTING_SCOPE_MATCH
  rationale: >-
    Le renvoi de l'Instruction 66 porte précisément sur le délai de règlement des
    frais d'agrément. Les articles 18 et 19 de l'Instruction 54 révisée portent sur la
    même catégorie de frais et déterminent précisément ce délai. Le volet montant
    tarifaire demeure distinct et relève de la Décision du Conseil des Ministres.

