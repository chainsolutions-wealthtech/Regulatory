prohibited_merge_rule: >-
  Ne jamais fusionner un frais initial d'agrément, une redevance annuelle, une
  commission transactionnelle et un frais de contrôle dans un même champ de tarif
  sous prétexte qu'ils sont tous perçus par l'autorité de marché.

current_conclusion: >-
  La Décision CM/13/12/2011 reste un candidat officiel pour le tarif/montant visé à
  l'article 5, tandis que l'Instruction 54/2017 révisée est le candidat prioritaire
  pour les modalités/délais de paiement. Les décisions CREPMF 2020/027 et 2020/029
  démontrent l'existence de familles de frais postérieures distinctes, mais aucune
  preuve examinée ne permet de conclure qu'elles abrogent ou remplacent le tarif
  d'agrément de 2011.

