usage_policy:
  - Treat the official registry as the primary discovery and current-status source.
  - Record the registry check date for every status assertion.
  - Materialize and hash each normative document before detailed atomization when technically possible.
  - Preserve the exact title, reference, status and source URL.
  - Investigate amendments, rectifications, predecessor and replacement relationships.
  - Do not infer legal validity solely from search-engine indexing or a secondary copy.
  - Do not mark a requirement VALIDATED without legal and compliance review.
technical_notes:
  - Some registry tables and download links are dynamically rendered.
  - Secondary official-market-infrastructure publications may be used to locate a binary copy, with provenance recorded separately.
  - Missing binary access, hash or effective date must remain explicit and must not be invented.
