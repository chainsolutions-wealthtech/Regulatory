plan_id: INSTRUCTION_66_ATOMIZATION_PLAN_V0_1
version: 0.1.0
status: READY_WITH_BLOCKERS
created_on: '2026-08-05'
loop_id: LOOP-REG-001
task_id: TASK-REG-001
source_id: INSTRUCTION_66_CREPMF_2021
objective: >-
  Préparer une atomisation exhaustive et contrôlée de l'Instruction
  n°66/CREPMF/2021 sans modifier les identifiants existants de la Circulaire
  n°05/CREPMF/2022 et sans transformer une interprétation non revue en règle active.
invariants:
  - Preserve all CIRC005 requirement identifiers and matrices.
  - Create stable INST066 requirement identifiers.
  - Keep normative requirements separate from observed market practice.
  - Record article, paragraph, page, applicability, product and effective period.
  - Do not assign VALIDATED, APPROVED or ACTIVE without formal review.
  - Do not invent thresholds, ratios, dates, exemptions or legal wordings.
phases:
  - id: P01_SOURCE_CONTROL
    objective: Complete source integrity and version control.
    outputs:
      - local_or_repository_copy_reference
      - byte_size
      - sha256
      - exact_signed_date
      - effective_date
      - predecessor_identification
      - amendments_rectifications_inventory
  - id: P02_DOCUMENT_STRUCTURE
    objective: Build the title, chapter, section and article index.
    outputs:
      - regulatory/requirements/INST066_ARTICLE_INDEX_V0_1.yaml
      - page_and_article_coordinates
  - id: P03_SCOPE_AND_DEFINITIONS
    objective: Atomize scope, definitions, product types and investor categories.
    domains:
      - OPC
      - OPCVM
      - FIA
      - FCP
      - investment_company
      - management_company
      - qualified_and_non_qualified_investors
  - id: P04_AUTHORIZATION_AND_GOVERNANCE
    objective: Atomize approvals, governance, organization, delegation and conflicts.
    domains:
      - fund_approval
      - management_company_approval
      - governance
      - internal_control
      - risk_management
      - remuneration
      - delegation
      - conflicts_of_interest
  - id: P05_INFORMATION_DOCUMENTS
    objective: Atomize prospectus, DICI, publication, advertising and investor information.
    domains:
      - prospectus
      - fund_regulation_and_constitutive_documents
      - DICI
      - net_asset_value_and_prices
      - marketing_communications
      - update_and_prior_approval
  - id: P06_INVESTMENT_AND_RISK_RULES
    objective: Atomize eligible assets, diversification, concentration, borrowing, derivatives and risk limits.
    domains:
      - eligible_assets
      - ratios_and_limits
      - counterparty
      - borrowing
      - derivatives
      - index_replication
      - concentration
      - liquidity
  - id: P07_VALUATION_AND_OPERATIONS
    objective: Atomize valuation, NAV, subscription, redemption, suspension and liquidity tools.
    domains:
      - valuation
      - net_asset_value
      - issue_and_subscription
      - redemption_and_reimbursement
      - suspension
      - liquidity_management_tools
  - id: P08_SERVICE_PROVIDERS_AND_CONTROL
    objective: Atomize depositary, custody, auditors, advisers and oversight duties.
    domains:
      - depositary
      - custody_and_sub_custody
      - auditor
      - external_adviser
      - distribution_and_paying_agents
  - id: P09_REPORTING_AND_LIFECYCLE
    objective: Atomize reporting, periodic information, changes, mergers, liquidation and sanctions references.
    domains:
      - periodic_reporting
      - regulator_reporting
      - material_changes
      - merger_and_restructuring
      - liquidation
      - dissolution
  - id: P10_CROSSWALK_AND_VALIDATION
    objective: Cross-reference Instruction 66 with Circulaire 05 and the canonical model.
    outputs:
      - regulatory/matrices/INST066_CIRC005_CROSSWALK_V0_1.csv
      - regulatory/validation/INST066_ATOMIZATION_VALIDATION_V0_1.json
      - docs/REGULATORY_MAPPING.md update
requirement_schema_minimum:
  - id
  - source_id
  - article
  - paragraph
  - page
  - title
  - summary
  - jurisdiction
  - products
  - document_types
  - applicability
  - effective_period
  - allowed_coverage_locations
  - canonical_fields
  - evidence_requirements
  - severity
  - dependencies
  - review_status
  - provenance
identifier_policy:
  prefix: INST066
  example: INST066_ART28_PROSPECTUS_MINIMUM_INFORMATION
  published_identifier_reuse: FORBIDDEN
acceptance_criteria:
  - Every visible article is indexed exactly once.
  - Every atomic requirement resolves to an article and page.
  - Parent and child requirements are distinguishable.
  - Cross-references to CIRC005 are explicit and non-destructive.
  - Duplicate semantic requirements are linked rather than recreated silently.
  - Applicability to FCP, SICAV, OPCVM, FIA and investor category is explicit.
  - Structural validation passes before legal review.
  - Legal and compliance review remain pending unless formally evidenced.
blockers:
  - Exact PDF byte size and SHA-256 are pending local materialization.
  - Exact signed date and effective date remain to be confirmed from the document.
  - The predecessor identified by the replacement statement remains to be identified.
  - Amendments, rectifications and related later instruments require an exhaustive registry review.
