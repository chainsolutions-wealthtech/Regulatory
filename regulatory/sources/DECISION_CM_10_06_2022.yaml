      n° CM / 10 / 06 / 2022 du Conseil des Ministres de l'Union Monétaire Ouest
      Africaine relative à la mise en œuvre du dispositif des sanctions pécuniaires
      applicables sur le marché financier régional de l'UMOA.
    evidence_scope: EXACT_REFERENCE_AND_TITLE_CONFIRMED_BY_PUBLIC_AUTHORITY
  secondary_corroboration:
