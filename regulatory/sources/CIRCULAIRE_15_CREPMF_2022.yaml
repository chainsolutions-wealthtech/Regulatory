  evidence: >-
    The circular expressly defines Instruction as Instruction n°66/CREPMF/2021.
    It specifies risk-management systems and review frequency, gives the gross
    method used to calculate exposure/global risk, requires independent fair-value
    procedures for OTC derivatives and specifies annual derivative reporting to the
    Council Regional. These scopes match the Article 11 and both Article 40 circular
    delegations.
