inst066_candidate_relationships:
  - dependency_id: INST066_ART005_DEP_INST_03
    inst066_subject: "délais de règlement des frais d'agrément après agrément de la Société de Gestion d'OPC"
    rationale: >-
      L'article 5 de l'Instruction 66 distingue les montants des frais d'agrément,
      fixés par une Décision du Conseil des Ministres, et leurs délais de règlement,
      fixés par une Instruction du Conseil Régional. Le Titre VI de l'Instruction
      54/CREPMF/2017 révisée traite spécifiquement des frais pour habilitation,
      agrément et approbation. Ses articles 18 et 19 fixent l'exigibilité et le délai
      maximal de paiement à quinze (15) jours calendaires à compter de l'envoi de la
      facture. La portée déléguée et la portée du texte d'application correspondent.
    match_status: EXACT_DOCUMENTARY_IMPLEMENTING_MATCH_PENDING_LEGAL_AND_COMPLIANCE_REVIEW
    resolved_documentary_level: true
    requirement_activation_allowed: false

