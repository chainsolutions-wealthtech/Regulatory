related_tariff_source_candidate:
  reference: "Décision n° CM/13/12/2011"
  title: "Décision portant fixation des tarifs du Conseil Régional de l'Épargne Publique et des Marchés Financiers"
  relationship_to_inst066_article5: >-
    L'article 5 de l'Instruction 66 distingue les montants des frais, précisés dans
    une Décision du Conseil des Ministres, et leurs délais de règlement, fixés par
    une Instruction du Conseil Régional. La Décision 2011 est donc une pièce
    complémentaire candidate pour les montants, sans préjuger de sa version courante.
  relationship_status: TO_MATERIALIZE_AND_COMPARE

