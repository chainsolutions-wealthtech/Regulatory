  relationship_to_inst066_article5: >-
    L'article 5 de l'Instruction 66 distingue les montants des frais, précisés dans
    une Décision du Conseil des Ministres, et leurs délais de règlement, fixés par
    une Instruction du Conseil Régional. La Décision 2011 est donc la source
    institutionnelle à analyser séparément pour le volet tarifaire. La résolution
    documentaire du délai vers Instruction 54 n'active aucun montant tarifaire.
