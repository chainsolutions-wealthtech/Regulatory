notes:
  - "La date de signature du 10 décembre 2020 et l'entrée en vigueur au 1er janvier 2021 sont lues dans l'article 17 du binaire officiel matérialisé."
  - "L'article 3 définit quatre étapes : dépôt, analyse de conformité, instruction, décision."
  - "Les articles 8 et 13 fixent à vingt jours ouvrés les délais de transmission des compléments dans les cas visés et prévoient la clôture."
  - "L'article 14 fixe à trois mois maximum le délai pour se prononcer sur une demande d'agrément et rendre la décision."
  - "L'article 15 prévoit la notification des décisions mais ne fixe pas de délai post-décision distinct ; ART017_DEP_INST_01 reste donc ouvert."
  - "Instruction 66 définit expressément la Société d'Investissement comme un OPC ; le délai d'Instruction 64 s'applique donc documentairement à ART025_DEP_INST_01."
