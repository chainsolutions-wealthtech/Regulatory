name: Render Instruction 66 Legal Metadata Evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-instruction-66-legal-metadata.yml
      - scripts/render_instruction_66_legal_metadata_evidence.py
      - regulatory/materialized/INSTRUCTION_66_CREPMF_2021.pdf
      - regulatory/materialized/INSTRUCTION_66_CREPMF_2021.metadata.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-instruction-66-legal-metadata-evidence-main
  cancel-in-progress: false

jobs:
  render-final-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Render source-verified pages 64 and 65
        run: python3 scripts/render_instruction_66_legal_metadata_evidence.py
      - name: Validate evidence remains pending human review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('regulatory/review-evidence/INST066_LEGAL_METADATA')
          for page in (64, 65):
              image_path = root / f'page-{page}.png'
              assert image_path.exists() and image_path.stat().st_size > 10000, image_path
              with Image.open(image_path) as image:
                  assert image.width > 1000 and image.height > 1000, image.size
          checklist = (root / 'REVIEW_CHECKLIST_V0_1.yaml').read_text(encoding='utf-8')
          assert 'status: PENDING_HUMAN_LEGAL_AND_COMPLIANCE_REVIEW' in checklist
          assert 'dates_confirmed: false' in checklist
          assert 'abrogation_inventory_confirmed: false' in checklist
          assert 'requirements_activated: false' in checklist
          PY
      - name: Upload legal metadata review evidence
        uses: actions/upload-artifact@v4
        with:
          name: instruction-66-legal-metadata-review-evidence
          path: regulatory/review-evidence/INST066_LEGAL_METADATA
          if-no-files-found: error
          retention-days: 90
      - name: Commit rendered evidence and pending checklist
        run: |
          git config user.name "regulatory-source-bot"
          git config user.email "regulatory-source-bot@users.noreply.github.com"
          git add regulatory/review-evidence/INST066_LEGAL_METADATA
          if git diff --cached --quiet; then
            echo "No rendered evidence changes to commit."
            exit 0
          fi
          git commit -m "regulatory: render Instruction 66 legal metadata evidence"
          git pull --rebase origin main
          git push origin HEAD:main
