name: Build INST066 External Research Queue

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-inst066-external-research-queue.yml
      - scripts/build_inst066_external_dependency_research_queue.py
      - regulatory/registries/INST066_EXTERNAL_IMPLEMENTING_TEXTS_INVENTORY_V0_1.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inst066-external-research-queue-main
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deterministic research queue
        run: python3 scripts/build_inst066_external_dependency_research_queue.py

      - name: Validate queue boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path(
              'regulatory/registries/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_V0_1.json'
          ).read_text(encoding='utf-8'))
          validation = json.loads(Path(
              'regulatory/validation/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_VALIDATION_V0_1.json'
          ).read_text(encoding='utf-8'))
          assert validation['status'] == 'PASS', validation
          assert queue['summary']['articleCount'] == 26
          assert queue['summary']['dependencyOccurrenceCount'] == 49
          assert queue['summary']['unresolvedOccurrenceCount'] == 47
          assert queue['summary']['resolvedOccurrenceCount'] == 2
          assert queue['safety']['groupingImpliesSameInstrument'] is False
          assert queue['safety']['automaticReferenceInferenceAllowed'] is False
          assert queue['safety']['automaticDependencyResolutionAllowed'] is False
          assert queue['safety']['automaticRequirementActivationAllowed'] is False
          assert queue['safety']['readyForSubmissionMustRemainFalse'] is True
          assert any(article['articleNumber'] == 74 for article in queue['articles'])
          assert any(article['articleNumber'] == 80 for article in queue['articles'])
          PY

      - name: Upload research queue
        uses: actions/upload-artifact@v4
        with:
          name: inst066-external-dependency-research-queue
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/registries/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_V0_1.json
            regulatory/validation/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_VALIDATION_V0_1.json

      - name: Commit deterministic queue
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'regulatory-source-bot'
          git config user.email 'regulatory-source-bot@users.noreply.github.com'
          git add \
            regulatory/registries/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_V0_1.json \
            regulatory/validation/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo 'No research queue changes to commit.'
          else
            git commit -m 'regulatory: build Instruction 66 external dependency research queue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
