name: Build AMF-UMOA Circular API Catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-amf-umoa-circular-api-catalog.yml
      - scripts/build_amf_umoa_circular_api_catalog.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amf-umoa-circular-api-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build bounded official API catalog
        run: python3 scripts/build_amf_umoa_circular_api_catalog.py

      - name: Validate safety boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('regulatory/registries/AMF_UMOA_CIRCULAR_API_CATALOG_V0_1.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('regulatory/validation/AMF_UMOA_CIRCULAR_API_CATALOG_VALIDATION_V0_1.json').read_text(encoding='utf-8'))
          if catalog['result'] != 'PASS' or validation['result'] != 'PASS':
              raise SystemExit('AMF circular API catalog is incomplete')
          if catalog['circularCount'] < 39:
              raise SystemExit(f"Expected at least 39 circulars, got {catalog['circularCount']}")
          boundary = catalog['boundary']
          if boundary['automaticDependencyResolutionAllowed'] is not False:
              raise SystemExit('automatic dependency resolution must remain false')
          if boundary['automaticRequirementActivationAllowed'] is not False:
              raise SystemExit('automatic requirement activation must remain false')
          if boundary['readyForSubmissionMustRemainFalse'] is not True:
              raise SystemExit('ready_for_submission safety boundary missing')
          PY

      - name: Check textual integrity
        run: git diff --check

      - name: Commit generated research catalog
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            regulatory/registries/AMF_UMOA_CIRCULAR_API_CATALOG_V0_1.json \
            regulatory/validation/AMF_UMOA_CIRCULAR_API_CATALOG_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
          else
            git commit -m 'chore: refresh official AMF-UMOA circular API catalog'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
