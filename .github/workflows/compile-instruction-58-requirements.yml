name: Compile Instruction 58 Detailed Requirements

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compile-instruction-58-requirements.yml
      - scripts/compile_instruction_58_requirement_candidates.py
      - regulatory/requirements/inst058-candidates/*.json
      - regulatory/requirements/INST058_ARTICLE_BLOCKS_V0_1.json
      - regulatory/requirements/INST058_ARTICLE_ATOMS_V0_1.json
      - regulatory/requirements/INST066_PROSPECTUS_REQUIREMENT_CANDIDATES_V0_1.json
      - regulatory/matrices/CIRC005_*.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-instruction-58-detailed-requirements-main
  cancel-in-progress: false

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot upstream regulatory matrices
        run: |
          sha256sum regulatory/matrices/CIRC005_*.csv > /tmp/circ005-before.sha256
          sha256sum regulatory/requirements/INST066_PROSPECTUS_REQUIREMENT_CANDIDATES_V0_1.json > /tmp/inst066-before.sha256
      - name: Compile detailed Instruction 58 candidates
        run: python3 scripts/compile_instruction_58_requirement_candidates.py
      - name: Validate compiled registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path(
              'regulatory/requirements/INST058_AUDITOR_REQUIREMENT_CANDIDATES_V0_1.json'
          ).read_text(encoding='utf-8'))
          validation = json.loads(Path(
              'regulatory/validation/INST058_DETAILED_REQUIREMENTS_VALIDATION_V0_1.json'
          ).read_text(encoding='utf-8'))
          specs = []
          for path in sorted(Path('regulatory/requirements/inst058-candidates').glob('*.json')):
              doc = json.loads(path.read_text(encoding='utf-8'))
              specs.extend(doc.get('requirements', []))

          assert validation['status'] == 'PASS', validation
          assert registry['activation'] == 'FORBIDDEN'
          assert registry['status'].startswith('EXTRACTED_UNVERIFIED')
          assert registry['requirementCandidateCount'] == len(specs)
          assert registry['requirementCandidateCount'] > 0
          ids = [item['id'] for item in registry['requirements']]
          assert len(ids) == len(set(ids))
          assert all(item['activation'] == 'FORBIDDEN' for item in registry['requirements'])
          assert all(item['legalReviewStatus'] == 'PENDING' for item in registry['requirements'])
          assert all(item['complianceReviewStatus'] == 'PENDING' for item in registry['requirements'])
          assert all('LEGAL' in item['reviewRoles'] and 'COMPLIANCE' in item['reviewRoles'] for item in registry['requirements'])
          assert all(item['sourcePages'] and item['sourceArticleTextSha256'] for item in registry['requirements'])
          assert validation['checks']['allCirc005LinksResolve'] is True
          assert validation['checks']['allInst066LinksResolve'] is True
          assert validation['checks']['sourceStatusNotPromoted'] is True
          PY
      - name: Confirm upstream sources are byte-identical
        run: |
          sha256sum --check /tmp/circ005-before.sha256
          sha256sum --check /tmp/inst066-before.sha256
          git diff --exit-code -- regulatory/matrices/CIRC005_*.csv
          git diff --exit-code -- regulatory/requirements/INST066_PROSPECTUS_REQUIREMENT_CANDIDATES_V0_1.json
      - name: Upload Instruction 58 detailed evidence
        uses: actions/upload-artifact@v4
        with:
          name: instruction-58-detailed-requirement-candidates
          path: |
            regulatory/requirements/INST058_AUDITOR_REQUIREMENT_CANDIDATES_V0_1.json
            regulatory/matrices/INST058_CIRC005_INST066_CROSSWALK_V0_1.csv
            regulatory/validation/INST058_DETAILED_REQUIREMENTS_VALIDATION_V0_1.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit compiled Instruction 58 requirements
        run: |
          git config user.name "regulatory-source-bot"
          git config user.email "regulatory-source-bot@users.noreply.github.com"
          git add \
            regulatory/requirements/INST058_AUDITOR_REQUIREMENT_CANDIDATES_V0_1.json \
            regulatory/matrices/INST058_CIRC005_INST066_CROSSWALK_V0_1.csv \
            regulatory/validation/INST058_DETAILED_REQUIREMENTS_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo "No Instruction 58 detailed requirement changes to commit."
            exit 0
          fi
          git commit -m "regulatory: compile Instruction 58 requirement candidates"
          git pull --rebase origin main
          git push origin HEAD:main
