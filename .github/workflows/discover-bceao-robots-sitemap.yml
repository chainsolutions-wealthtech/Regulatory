name: Discover BCEAO Robots Sitemap Surface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-bceao-robots-sitemap.yml
      - scripts/discover_bceao_robots_sitemap.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bceao-robots-sitemap-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect BCEAO robots-declared sitemap surface
        run: python3 scripts/discover_bceao_robots_sitemap.py
      - name: Validate read-only boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json').read_text())
          v=json.loads(Path('regulatory/validation/BCEAO_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json').read_text())
          assert e['result']=='PASS' and v['result']=='PASS'
          for k in ['robotsOnlyEntryPoint','declaredSitemapsOnly','maxDeclaredSitemapsFive','childSitemapsNotFetched','linkedDocumentsNotFetched','binaryNotMaterialized','workflowRepositoryWriteDisabled','automaticRelationshipInferenceForbidden','automaticSanctionActivationForbidden','readyForSubmissionFalse']:
              assert v['checks'][k] is True,k
          PY
      - run: git diff --check
      - name: Emit evidence to workflow log
        run: |
          echo '=== BCEAO_ROBOTS_SITEMAP_EVIDENCE ==='
          cat regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json
          echo '=== BCEAO_ROBOTS_SITEMAP_VALIDATION ==='
          cat regulatory/validation/BCEAO_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bceao-robots-sitemap
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json
            regulatory/validation/BCEAO_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json
