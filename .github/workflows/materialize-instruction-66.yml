name: Materialize Instruction 66

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-instruction-66.yml
      - scripts/materialize_instruction_66.py
      - scripts/index_instruction_66_articles.py
      - regulatory/sources/INSTRUCTION_66_CREPMF_2021.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-instruction-66-materialization-main
  cancel-in-progress: false

jobs:
  materialize-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF and French OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            ocrmypdf \
            tesseract-ocr \
            tesseract-ocr-fra
      - name: Download and hash official PDF
        run: python3 scripts/materialize_instruction_66.py
      - name: Rebuild complete article index
        run: python3 scripts/index_instruction_66_articles.py
      - name: Validate generated source evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path(
              'regulatory/materialized/INSTRUCTION_66_CREPMF_2021.metadata.json'
          ).read_text(encoding='utf-8'))
          validation = json.loads(Path(
              'regulatory/validation/INST066_MATERIALIZATION_VALIDATION_V0_1.json'
          ).read_text(encoding='utf-8'))

          assert validation['status'] == 'PASS', validation
          assert metadata['pageCount'] == 65, metadata['pageCount']
          assert len(metadata['sha256']) == 64, metadata['sha256']
          assert metadata['byteSize'] > 10000, metadata['byteSize']
          assert metadata['articleIndexCount'] >= 90, metadata['articleIndexCount']
          assert metadata['firstIndexedArticle'] == 1, metadata['firstIndexedArticle']
          assert metadata['lastIndexedArticle'] >= 90, metadata['lastIndexedArticle']
          assert metadata['missingArticleNumbers'] == [], metadata['missingArticleNumbers']
          assert metadata['extraction']['ocrUsed'] is True
          assert metadata['extraction']['ocrLanguage'] == 'fra'
          assert metadata['extraction']['ocrDerivativeCommitted'] is False
          assert metadata['legalMetadata']['exactSignedDate'] is None
          assert metadata['legalMetadata']['effectiveFrom'] is None
          assert metadata['legalMetadata']['predecessorReplaced'] == 'TO_IDENTIFY'
          assert metadata['extraction']['status'] == 'MATERIALIZED_ARTICLE_INDEX_EXTRACTED_UNVERIFIED'
          assert validation['checks']['articlePremierIndexed'] is True
          assert validation['checks']['articleNumberRangeContinuous'] is True
          assert validation['checks']['articleIndexStillUnverified'] is True

          index_text = Path(
              'regulatory/requirements/INST066_ARTICLE_INDEX_V0_1.yaml'
          ).read_text(encoding='utf-8')
          assert 'status: EXTRACTED_UNVERIFIED_REVIEW_PENDING' in index_text
          assert '- id: INST066_ARTICLE_001' in index_text
          assert 'requirement_activation: FORBIDDEN_PENDING_REVIEW' in index_text
          assert 'review_status: PENDING_LEGAL_AND_COMPLIANCE_REVIEW' in index_text
          assert 'ocr_used: true' in index_text
          PY
      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instruction-66-official-materialization
          path: |
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.pdf
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.txt
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.metadata.json
            regulatory/requirements/INST066_ARTICLE_INDEX_V0_1.yaml
            regulatory/validation/INST066_MATERIALIZATION_VALIDATION_V0_1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit official source and structural index
        run: |
          git config user.name "regulatory-source-bot"
          git config user.email "regulatory-source-bot@users.noreply.github.com"
          git add \
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.pdf \
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.txt \
            regulatory/materialized/INSTRUCTION_66_CREPMF_2021.metadata.json \
            regulatory/requirements/INST066_ARTICLE_INDEX_V0_1.yaml \
            regulatory/validation/INST066_MATERIALIZATION_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "regulatory: materialize official Instruction 66 source"
          git pull --rebase origin main
          git push origin HEAD:main
