name: Materialize AMF-UMOA Pending API Backfill

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-amf-umoa-pending-api-backfill.yml
      - scripts/materialize_amf_umoa_pending_api_backfill.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amf-umoa-pending-api-backfill-main
  cancel-in-progress: false

jobs:
  materialize-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF and French OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-fra

      - name: Materialize eight official AMF-UMOA API documents
        run: python3 scripts/materialize_amf_umoa_pending_api_backfill.py

      - name: Validate completeness and safety boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path(
              'regulatory/registries/AMF_UMOA_PENDING_API_BACKFILL_V0_1.json'
          ).read_text(encoding='utf-8'))
          validation = json.loads(Path(
              'regulatory/validation/AMF_UMOA_PENDING_API_BACKFILL_VALIDATION_V0_1.json'
          ).read_text(encoding='utf-8'))

          assert registry['status'] == 'COMPLETE_8_OF_8', registry
          assert registry['documentCount'] == 8
          assert validation['result'] == 'PASS', validation
          assert validation['checks']['exactly8Documents'] is True
          assert validation['checks']['noFailures'] is True
          assert validation['checks']['historicalReactivationForbidden'] is True
          assert validation['checks']['automaticResolutionForbidden'] is True
          boundary = registry['boundary']
          assert boundary['binaryMaterializationIsLegalResolution'] is False
          assert boundary['portalMetadataMayReactivateHistoricalText'] is False
          assert boundary['automaticDependencyResolutionAllowed'] is False
          assert boundary['automaticRequirementActivationAllowed'] is False
          assert boundary['readyForSubmissionMustRemainFalse'] is True
          assert all(doc['sha256'] for doc in registry['documents'])
          assert all(doc['pageCount'] > 0 for doc in registry['documents'])
          assert all(doc['usefulTextChars'] >= 150 for doc in registry['documents'])
          PY

      - name: Check textual integrity
        run: git diff --check

      - name: Upload backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amf-umoa-pending-api-backfill
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/sources/amf-umoa-pending-api-backfill/
            regulatory/registries/AMF_UMOA_PENDING_API_BACKFILL_V0_1.json
            regulatory/validation/AMF_UMOA_PENDING_API_BACKFILL_VALIDATION_V0_1.json

      - name: Commit materialized official documents
        run: |
          git config user.name 'regulatory-source-bot'
          git config user.email 'regulatory-source-bot@users.noreply.github.com'
          git add \
            regulatory/sources/amf-umoa-pending-api-backfill/ \
            regulatory/registries/AMF_UMOA_PENDING_API_BACKFILL_V0_1.json \
            regulatory/validation/AMF_UMOA_PENDING_API_BACKFILL_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo 'No AMF-UMOA backfill changes to commit.'
          else
            git commit -m 'regulatory: materialize pending AMF-UMOA API backfill'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
