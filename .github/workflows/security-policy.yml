name: Security and Review Policy CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulatory-security-policy-main
  cancel-in-progress: true

jobs:
  validate-policy-and-review-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: regulatory_policy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regulatory_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install application dependencies
        run: npm run web:install
      - name: Generate regulatory catalog
        run: npm run generate:web-catalog
      - name: Typecheck application
        run: npm run web:typecheck
      - name: Validate RBAC and workflow engines
        run: npm --prefix apps/web run test:authorization-workflow
      - name: Validate secure evidence object store
        run: npm --prefix apps/web run test:evidence-store
      - name: Apply security and review migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5433'
          PGDATABASE: regulatory_policy_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f database/tests/0002_secure_evidence_storage_test.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0003_evidence_scan_lease_test.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select 1 from pg_type where typname = 'review_role';
          select 1 from pg_type where typname = 'project_status';
          select 1 from pg_type where typname = 'evidence_object_state';
          select 1 from information_schema.tables where table_schema = 'regulatory' and table_name = 'review_comments';
          select 1 from information_schema.tables where table_schema = 'regulatory' and table_name = 'internal_approvals';
          select 1 from information_schema.tables where table_schema = 'regulatory' and table_name = 'project_transition_events';
          select 1 from information_schema.tables where table_schema = 'regulatory' and table_name = 'evidence_objects';
          do $$
          begin
            if not exists (
              select 1 from pg_enum e
              join pg_type t on t.oid = e.enumtypid
              where t.typname = 'review_role' and e.enumlabel = 'ADMIN'
            ) then raise exception 'ADMIN_ROLE_MISSING'; end if;
            if not exists (
              select 1 from pg_enum e
              join pg_type t on t.oid = e.enumtypid
              where t.typname = 'review_role' and e.enumlabel = 'READER'
            ) then raise exception 'READER_ROLE_MISSING'; end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'regulatory'
                and tablename = 'project_transition_events'
                and policyname = 'project_transition_events_tenant_insert_policy'
            ) then raise exception 'TRANSITION_INSERT_POLICY_MISSING'; end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'regulatory'
                and tablename = 'evidence_objects'
                and policyname = 'evidence_objects_tenant_policy'
            ) then raise exception 'EVIDENCE_OBJECT_POLICY_MISSING'; end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'regulatory' and table_name = 'evidence_objects'
                and column_name = 'scan_lease_expires_at'
            ) then raise exception 'EVIDENCE_SCAN_LEASE_MISSING'; end if;
            if not exists (
              select 1 from pg_indexes
              where schemaname = 'regulatory' and indexname = 'evidence_objects_scan_queue_idx'
            ) then raise exception 'EVIDENCE_SCAN_QUEUE_INDEX_MISSING'; end if;
          end;
          $$;
          SQL
      - name: Ensure submission and evidence privilege separation stay enforced
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const rbac = JSON.parse(await readFile('policies/rbac/PROSPECTUS_RBAC_V1.json', 'utf8'));
          const workflow = JSON.parse(await readFile('policies/workflow/PROSPECTUS_REVIEW_WORKFLOW_V1.json', 'utf8'));
          const evidence = JSON.parse(await readFile('policies/evidence/SECURE_EVIDENCE_STORAGE_V1.json', 'utf8'));
          if (rbac.actions.SUBMISSION_SEND.disabled !== true) throw new Error('SUBMISSION_SEND must be disabled');
          if (rbac.actions.SUBMISSION_MARK_READY.disabled !== true) throw new Error('SUBMISSION_MARK_READY must be disabled');
          if (!rbac.grants.SECURITY.includes('EVIDENCE_SCAN')) throw new Error('SECURITY must own EVIDENCE_SCAN');
          if (rbac.grants.SECURITY.includes('EVIDENCE_VERIFY')) throw new Error('SECURITY must not own EVIDENCE_VERIFY');
          if (!rbac.grants.COMPLIANCE.includes('EVIDENCE_VERIFY')) throw new Error('COMPLIANCE must own EVIDENCE_VERIFY');
          if (rbac.grants.COMPLIANCE.includes('EVIDENCE_SCAN')) throw new Error('COMPLIANCE must not own EVIDENCE_SCAN');
          if (rbac.grants.PRODUCT.includes('EVIDENCE_SCAN') || rbac.grants.PRODUCT.includes('EVIDENCE_VERIFY')) {
            throw new Error('PRODUCT must not scan or verify evidence');
          }
          if (workflow.submission.enabled !== false || workflow.submission.readyFlag !== false) {
            throw new Error('Workflow submission must remain disabled');
          }
          if (!workflow.forbiddenAutomaticTransitions.includes('INTERNALLY_FROZEN')) {
            throw new Error('Automatic internal freeze must remain forbidden');
          }
          if (evidence.storage.publicAccess !== false || evidence.download.publicUrlForbidden !== true) {
            throw new Error('Evidence public access must remain forbidden');
          }
          if (evidence.malwareScanning.cleanResultRequiredBeforeRelease !== true) {
            throw new Error('Clean malware scan must remain required before release');
          }
          if (evidence.claims.productionStorageOperational !== false) {
            throw new Error('Policy must not claim production storage is operational');
          }
          NODE
