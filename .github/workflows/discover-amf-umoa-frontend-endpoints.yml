name: Discover AMF-UMOA Frontend Endpoints

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_amf_umoa_frontend_endpoints.py'
      - '.github/workflows/discover-amf-umoa-frontend-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover frontend endpoint candidates
        run: python3 scripts/discover_amf_umoa_frontend_endpoints.py
      - name: Commit diagnostic
        run: |
          if git status --porcelain -- regulatory/diagnostics/AMF_UMOA_FRONTEND_ENDPOINT_DISCOVERY_2026-08-08.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add regulatory/diagnostics/AMF_UMOA_FRONTEND_ENDPOINT_DISCOVERY_2026-08-08.json
            git commit -m 'regulatory: record AMF-UMOA frontend endpoint discovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
