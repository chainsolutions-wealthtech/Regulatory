name: Build INST066 Current External Dependency State

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-inst066-current-external-dependency-state.yml
      - scripts/build_inst066_current_external_dependency_state.py
      - regulatory/registries/INST066_EXTERNAL_IMPLEMENTING_TEXTS_INVENTORY_V0_1.json
      - regulatory/registries/INST066_CONFIRMED_EXTERNAL_DEPENDENCY_RESOLUTIONS_V0_1.yaml
      - regulatory/registries/INST066_CONFIRMED_INSTRUCTION_DEPENDENCY_RESOLUTIONS_V0_1.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inst066-current-external-dependency-state
  cancel-in-progress: false

jobs:
  build-current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Overlay confirmed documentary resolutions
        run: python3 scripts/build_inst066_current_external_dependency_state.py

      - name: Validate safety and structural invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('regulatory/registries/INST066_CURRENT_EXTERNAL_DEPENDENCY_STATE_V0_1.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('regulatory/validation/INST066_CURRENT_EXTERNAL_DEPENDENCY_STATE_VALIDATION_V0_1.json').read_text(encoding='utf-8'))
          inventory = json.loads(Path('regulatory/registries/INST066_EXTERNAL_IMPLEMENTING_TEXTS_INVENTORY_V0_1.json').read_text(encoding='utf-8'))

          if validation['result'] != 'PASS':
              raise SystemExit('current dependency state validation failed')

          summary = state['summary']
          expected_total = inventory['summary']['dependencyOccurrenceCount']
          if summary['dependencyOccurrenceCount'] != expected_total:
              raise SystemExit('dependency occurrence count changed from immutable inventory')
          if summary['resolvedDocumentaryCount'] + summary['unresolvedDocumentaryCount'] != expected_total:
              raise SystemExit('resolved/unresolved arithmetic mismatch')
          if summary['confirmedOverlayResolutionCount'] != (
              summary['confirmedCircularOverlayResolutionCount']
              + summary['confirmedInstructionFamilyOverlayResolutionCount']
          ):
              raise SystemExit('overlay counter arithmetic mismatch')
          if summary['resolvedDocumentaryCount'] != (
              summary['rawInventoryResolvedCount'] + summary['confirmedOverlayResolutionCount']
          ):
              raise SystemExit('resolved count does not equal raw resolutions plus overlays')

          for kind, expected in inventory['summary']['countsByKind'].items():
              bucket = summary['countsByKind'].get(kind)
              if not bucket or bucket['total'] != expected:
                  raise SystemExit(f'kind total changed: {kind}')
              if bucket['resolved'] + bucket['unresolved'] != bucket['total']:
                  raise SystemExit(f'kind arithmetic mismatch: {kind}')

          boundary = state['boundary']
          if boundary['automaticDependencyResolutionAllowed'] is not False:
              raise SystemExit('automatic dependency resolution must remain false')
          if boundary['automaticRequirementActivationAllowed'] is not False:
              raise SystemExit('automatic requirement activation must remain false')
          if boundary['readyForSubmissionMustRemainFalse'] is not True:
              raise SystemExit('ready_for_submission boundary missing')
          PY

      - name: Check textual integrity
        run: git diff --check

      - name: Commit generated current state
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            regulatory/registries/INST066_CURRENT_EXTERNAL_DEPENDENCY_STATE_V0_1.json \
            regulatory/validation/INST066_CURRENT_EXTERNAL_DEPENDENCY_STATE_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo 'No current dependency state changes to commit.'
          else
            git commit -m 'chore: refresh current Instruction 66 external dependency state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
