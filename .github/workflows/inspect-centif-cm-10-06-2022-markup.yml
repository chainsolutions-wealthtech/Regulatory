name: Inspect CENTIF CM-10-06-2022 Markup With Verified TLS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-centif-cm-10-06-2022-markup.yml
      - scripts/inspect_centif_cm_10_06_2022_markup.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centif-cm-10-06-2022-markup-main
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect target markup with X509/PKCS7 AIA chain repair
        run: python3 scripts/inspect_centif_cm_10_06_2022_markup.py

      - name: Validate fail-closed boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ep=Path('regulatory/review-evidence/SANCTIONS_2016_2022/CENTIF_TARGET_MARKUP_VERIFIED_TLS_2026-09-23.json')
          vp=Path('regulatory/validation/CENTIF_TARGET_MARKUP_VERIFIED_TLS_VALIDATION_V0_2.json')
          assert ep.exists() and vp.exists()
          e=json.loads(ep.read_text())
          v=json.loads(vp.read_text())
          for key in [
              'knownCentifPagesOnly','tlsVerificationNeverDisabled','hostnameVerificationNeverDisabled',
              'aiaRestrictedToCertificateChainRepair','candidateLocatorsNotFollowed','binaryNotMaterialized',
              'workflowRepositoryWriteDisabled','automaticRelationshipInferenceForbidden',
              'automaticSanctionActivationForbidden','readyForSubmissionFalse'
          ]:
              assert v['checks'][key] is True,key
          PY

      - run: git diff --check
        if: always()

      - name: Emit CENTIF evidence
        if: always()
        run: |
          echo '=== CENTIF_TARGET_MARKUP_EVIDENCE_V0_2 ==='
          cat regulatory/review-evidence/SANCTIONS_2016_2022/CENTIF_TARGET_MARKUP_VERIFIED_TLS_2026-09-23.json || true
          echo '=== CENTIF_TARGET_MARKUP_VALIDATION_V0_2 ==='
          cat regulatory/validation/CENTIF_TARGET_MARKUP_VERIFIED_TLS_VALIDATION_V0_2.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centif-cm-10-06-2022-markup-v0-2
          retention-days: 30
          if-no-files-found: warn
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/CENTIF_TARGET_MARKUP_VERIFIED_TLS_2026-09-23.json
            regulatory/validation/CENTIF_TARGET_MARKUP_VERIFIED_TLS_VALIDATION_V0_2.json
