name: Regulatory CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-ci-main
  cancel-in-progress: true

jobs:
  test-generate-document-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: regulatory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regulatory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system test and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libreoffice-writer \
            poppler-utils

      - name: Apply and test PostgreSQL regulatory schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: regulatory_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f database/tests/0001_regulatory_core_test.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'regulatory_app_ci') then
              create role regulatory_app_ci
                login
                password 'regulatory_app_ci_password'
                nosuperuser
                nocreatedb
                nocreaterole
                noinherit
                nobypassrls;
            else
              alter role regulatory_app_ci
                login
                password 'regulatory_app_ci_password'
                nosuperuser
                nocreatedb
                nocreaterole
                noinherit
                nobypassrls;
            end if;
          end;
          $$;
          grant connect on database regulatory_test to regulatory_app_ci;
          grant usage on schema regulatory to regulatory_app_ci;
          grant select, insert, update, delete on all tables in schema regulatory to regulatory_app_ci;
          grant usage, select on all sequences in schema regulatory to regulatory_app_ci;
          grant execute on all functions in schema regulatory to regulatory_app_ci;
          alter default privileges in schema regulatory
            grant select, insert, update, delete on tables to regulatory_app_ci;
          alter default privileges in schema regulatory
            grant usage, select on sequences to regulatory_app_ci;
          alter default privileges in schema regulatory
            grant execute on functions to regulatory_app_ci;
          SQL
          mkdir -p regulatory/validation
          python3 - <<'PY'
          import json
          from pathlib import Path
          validation = {
              'validationId': 'POSTGRESQL_REGULATORY_CORE_VALIDATION_V1',
              'status': 'PASS',
              'postgresVersion': '17',
              'migrations': sorted(str(path) for path in Path('database/migrations').glob('*.sql')),
              'testScript': 'database/tests/0001_regulatory_core_test.sql',
              'checks': {
                  'migrationsApplied': True,
                  'assetRangeConstraints': True,
                  'singleHomeStateConstraint': True,
                  'readyForSubmissionLockedFalse': True,
                  'frozenVersionImmutable': True,
                  'auditAppendOnly': True,
                  'auditTenantInsertPolicy': True,
                  'rowLevelSecurityTenantIsolation': True,
                  'twoTenantSwitchVerified': True,
                  'nonOwnerApplicationRoleCreated': True,
              },
              'caveat': 'Validation sur PostgreSQL éphémère de CI. Elle ne constitue ni un déploiement, ni un audit de sécurité de production.'
          }
          Path('regulatory/validation/POSTGRESQL_CORE_VALIDATION.json').write_text(
              json.dumps(validation, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Install Next.js application dependencies
        run: npm run web:install

      - name: Generate and validate regulatory web catalog
        run: npm run generate:web-catalog

      - name: Typecheck Next.js application
        run: npm run web:typecheck

      - name: Test transactional PostgreSQL project repository
        env:
          DATABASE_URL: postgresql://regulatory_app_ci:regulatory_app_ci_password@127.0.0.1:5432/regulatory_test
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/regulatory_test
          PGOPTIONS: -c app.ci_role_name=regulatory_app_ci
          NODE_ENV: test
        run: npm --prefix apps/web run test:postgres-repository

      - name: Build Next.js application
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          REGULATORY_STORAGE_DRIVER: local-json

      - name: Test Next.js API over HTTP
        run: |
          export REGULATORY_LOCAL_DATA_ROOT="$RUNNER_TEMP/regulatory-web-data"
          export REGULATORY_WEB_BASE_URL='http://127.0.0.1:3100'
          export REGULATORY_STORAGE_DRIVER='local-json'
          export NEXT_TELEMETRY_DISABLED='1'
          npm --prefix apps/web run start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/regulatory-web.log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! npm run web:test:api; then
            cat "$RUNNER_TEMP/regulatory-web.log"
            exit 1
          fi

      - name: Run automated engine and schema tests
        run: npm test

      - name: Generate deterministic sample dossier
        run: npm run generate:sample
        env:
          GENERATION_TIMESTAMP: '2026-08-05T00:00:00.000Z'

      - name: Generate deterministic DOCX
        run: npm run generate:docx

      - name: Validate DOCX package and regulatory caveats
        run: npm run validate:docx

      - name: Render DOCX for visual inspection
        run: |
          root='examples/generated/united-capital-diamond'
          mkdir -p "$root/rendered-pages"
          libreoffice --headless --convert-to pdf --outdir "$root" "$root/prospectus-draft.docx"
          pdftoppm -png -r 120 "$root/prospectus-draft.pdf" "$root/rendered-pages/page"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('examples/generated/united-capital-diamond')
          pages = sorted(root.joinpath('rendered-pages').glob('page-*.png'))
          pdf = root / 'prospectus-draft.pdf'
          manifest = {
              'renderer': 'LibreOffice Writer + pdftoppm',
              'page_count': len(pages),
              'page_files': [str(page.relative_to(root)) for page in pages],
              'pdf_size_bytes': pdf.stat().st_size,
              'status': 'READY_FOR_VISUAL_INSPECTION',
              'caveat': 'PDF créé uniquement pour le contrôle visuel de la sortie DOCX; il ne constitue pas le futur export PDF réglementaire déterministe.'
          }
          root.joinpath('render-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          if len(pages) == 0:
              raise SystemExit('No rendered DOCX pages were produced')
          PY

      - name: Update Loop Engineering evidence
        run: |
          node scripts/protect-next-action-ownership.mjs
          next_action_before="$(sha256sum NEXT_ACTION.md | awk '{print $1}')"
          node scripts/update-loop-dev-docs.mjs
          node scripts/update-docx-loop-docs.mjs
          node scripts/update-visual-qa-docs.mjs
          node scripts/update-nextjs-docs.mjs
          node scripts/update-regulatory-catalog-docs.mjs
          node scripts/update-structured-share-class-docs.mjs
          node scripts/update-canonical-schema-docs.mjs
          node scripts/update-postgres-repository-docs.mjs
          next_action_after="$(sha256sum NEXT_ACTION.md | awk '{print $1}')"
          if [ "$next_action_before" != "$next_action_after" ]; then
            echo 'Generated evidence must not mutate NEXT_ACTION.md.' >&2
            git diff -- NEXT_ACTION.md || true
            exit 1
          fi

      - name: Validate generated invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const root = 'examples/generated/united-capital-diamond';
          const manifest = JSON.parse(await readFile(`${root}/generation-manifest.json`, 'utf8'));
          const concordance = JSON.parse(await readFile(`${root}/concordance.json`, 'utf8'));
          const docx = JSON.parse(await readFile(`${root}/docx-manifest.json`, 'utf8'));
          const render = JSON.parse(await readFile(`${root}/render-manifest.json`, 'utf8'));
          const catalog = JSON.parse(await readFile('regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json', 'utf8'));
          const api = JSON.parse(await readFile('regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json', 'utf8'));
          const postgres = JSON.parse(await readFile('regulatory/validation/POSTGRESQL_CORE_VALIDATION.json', 'utf8'));
          const repository = JSON.parse(await readFile('regulatory/validation/POSTGRESQL_REPOSITORY_VALIDATION.json', 'utf8'));
          const schema = JSON.parse(await readFile('schemas/canonical/PROSPECTUS_CANONICAL_MODEL_V1.schema.json', 'utf8'));
          if (concordance.length !== 62) throw new Error(`Expected 62 requirements, got ${concordance.length}`);
          if (manifest.coverage_counts.MISSING !== 0) throw new Error(`Expected MISSING=0, got ${manifest.coverage_counts.MISSING}`);
          if (manifest.ready_for_submission !== false || docx.ready_for_submission !== false) {
            throw new Error('ready_for_submission must remain false');
          }
          if (!Array.isArray(manifest.pending_review_requirement_ids) || manifest.pending_review_requirement_ids.length === 0) {
            throw new Error('Pending review requirements must remain explicit');
          }
          if (docx.component_count !== manifest.component_count) {
            throw new Error(`DOCX traceability mismatch: ${docx.component_count} vs ${manifest.component_count}`);
          }
          if (render.page_count !== 10) throw new Error(`Expected 10 rendered pages, got ${render.page_count}`);
          if (catalog.status !== 'PASS' || catalog.requirementCount !== 62) {
            throw new Error('Regulatory web catalog validation failed');
          }
          if (api.status !== 'PASS' || api.validationId !== 'CIRC005_WEB_API_INTEGRATION_VALIDATION_V4') {
            throw new Error('Web API V4 integration validation failed');
          }
          for (const check of [
            'structuredQuestionTypesExposed',
            'invalidStructuredRowsRejected',
            'shareClassesWrittenToCanonicalArray',
            'assetRangesWrittenToCanonicalArray',
            'feesWrittenToCanonicalArrays',
            'valuationMethodsWrittenToCanonicalArray',
            'governanceWrittenToCanonicalArray',
            'serviceProvidersWrittenToCanonicalArray',
            'risksWrittenToCanonicalArray',
            'countryArrangementsWrittenToCanonicalArray',
            'evidenceWrittenToCanonicalArray',
            'legacyRepeatingBucketsAvoided',
            'historicalComposerInvoked',
            'deterministicDocxValidated',
            'readyForSubmissionRemainsFalse',
          ]) {
            if (api.checks[check] !== true) throw new Error(`Web API invariant failed: ${check}`);
          }
          if (
            postgres.status !== 'PASS' ||
            postgres.checks.rowLevelSecurityTenantIsolation !== true ||
            postgres.checks.auditTenantInsertPolicy !== true
          ) {
            throw new Error('PostgreSQL core validation failed');
          }
          if (
            repository.status !== 'PASS' ||
            repository.checks.applicationRoleCannotBypassRls !== true ||
            repository.checks.optimisticConcurrencyConflict !== true ||
            repository.checks.auditInsertPolicy !== true ||
            repository.checks.auditHashChain !== true ||
            repository.checks.readyForSubmissionRemainsFalse !== true
          ) {
            throw new Error('PostgreSQL project repository validation failed');
          }
          if (schema.$defs.regulatoryContext.properties.ready_for_submission.const !== false) {
            throw new Error('Canonical schema must lock ready_for_submission to false');
          }
          NODE

      - name: Check textual integrity
        run: git diff --check

      - name: Upload review and validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-validation-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            examples/generated/united-capital-diamond/prospectus-draft.docx
            examples/generated/united-capital-diamond/docx-manifest.json
            examples/generated/united-capital-diamond/prospectus-draft.pdf
            examples/generated/united-capital-diamond/render-manifest.json
            examples/generated/united-capital-diamond/rendered-pages/*.png
            examples/generated/united-capital-diamond/generation-manifest.json
            examples/generated/united-capital-diamond/concordance.json
            regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json
            regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json
            regulatory/validation/POSTGRESQL_CORE_VALIDATION.json
            regulatory/validation/POSTGRESQL_REPOSITORY_VALIDATION.json
            schemas/canonical/PROSPECTUS_CANONICAL_MODEL_V1.schema.json
            database/migrations/*.sql
            database/tests/*.sql

      - name: Commit generated evidence and documentation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md IMPLEMENTATION.md STATUS.md LOOP_STATE.md CURRENT_ITERATION.md \
            WORK_LOG.md SUIVI.md TODO.md CHANGELOG.md HANDOFF.md \
            docs/ARCHITECTURE.md docs/PROSPECTUS_ENGINE_SPEC.md \
            docs/04-development/NEXTJS_ATOMIC_DESIGN.md apps/web/README.md \
            apps/web/package-lock.json \
            scripts/update-loop-dev-docs.mjs \
            scripts/update-docx-loop-docs.mjs \
            scripts/update-nextjs-docs.mjs \
            scripts/update-regulatory-catalog-docs.mjs \
            scripts/update-structured-share-class-docs.mjs \
            scripts/update-canonical-schema-docs.mjs \
            regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json \
            regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json \
            regulatory/validation/POSTGRESQL_CORE_VALIDATION.json \
            regulatory/validation/POSTGRESQL_REPOSITORY_VALIDATION.json \
            examples/generated/united-capital-diamond/prospectus-draft.md \
            examples/generated/united-capital-diamond/canonical-data.json \
            examples/generated/united-capital-diamond/questionnaire-state.json \
            examples/generated/united-capital-diamond/control-report.json \
            examples/generated/united-capital-diamond/concordance.json \
            examples/generated/united-capital-diamond/document-model.json \
            examples/generated/united-capital-diamond/answer-log.json \
            examples/generated/united-capital-diamond/generation-manifest.json \
            examples/generated/united-capital-diamond/prospectus-draft.docx \
            examples/generated/united-capital-diamond/docx-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore: refresh PostgreSQL repository and generation evidence'
            git push origin HEAD:main
          fi
