name: Regulatory CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-ci-main
  cancel-in-progress: true

jobs:
  test-generate-document-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Next.js application dependencies
        run: npm run web:install

      - name: Generate and validate regulatory web catalog
        run: npm run generate:web-catalog

      - name: Typecheck Next.js application
        run: npm run web:typecheck

      - name: Build Next.js application
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Test Next.js API over HTTP
        run: |
          export REGULATORY_LOCAL_DATA_ROOT="$RUNNER_TEMP/regulatory-web-data"
          export REGULATORY_WEB_BASE_URL='http://127.0.0.1:3100'
          export NEXT_TELEMETRY_DISABLED='1'
          npm run web:start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/regulatory-web.log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! npm run web:test:api; then
            cat "$RUNNER_TEMP/regulatory-web.log"
            exit 1
          fi

      - name: Install document rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils

      - name: Run automated engine tests
        run: npm test

      - name: Generate deterministic sample dossier
        run: npm run generate:sample
        env:
          GENERATION_TIMESTAMP: '2026-08-05T00:00:00.000Z'

      - name: Generate deterministic DOCX
        run: npm run generate:docx

      - name: Validate DOCX package and regulatory caveats
        run: npm run validate:docx

      - name: Render DOCX for visual inspection
        run: |
          root='examples/generated/united-capital-diamond'
          mkdir -p "$root/rendered-pages"
          libreoffice --headless --convert-to pdf --outdir "$root" "$root/prospectus-draft.docx"
          pdftoppm -png -r 120 "$root/prospectus-draft.pdf" "$root/rendered-pages/page"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('examples/generated/united-capital-diamond')
          pages = sorted(root.joinpath('rendered-pages').glob('page-*.png'))
          pdf = root / 'prospectus-draft.pdf'
          manifest = {
              'renderer': 'LibreOffice Writer + pdftoppm',
              'page_count': len(pages),
              'page_files': [str(page.relative_to(root)) for page in pages],
              'pdf_size_bytes': pdf.stat().st_size,
              'status': 'READY_FOR_VISUAL_INSPECTION',
              'caveat': 'PDF créé uniquement pour le contrôle visuel de la sortie DOCX; il ne constitue pas le futur export PDF réglementaire déterministe.'
          }
          root.joinpath('render-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          if len(pages) == 0:
              raise SystemExit('No rendered DOCX pages were produced')
          PY

      - name: Update Loop Engineering evidence
        run: |
          node scripts/update-loop-dev-docs.mjs
          node scripts/update-docx-loop-docs.mjs
          node scripts/update-visual-qa-docs.mjs
          node scripts/update-nextjs-loop-docs.mjs
          node scripts/update-regulatory-catalog-docs.mjs

      - name: Validate generated invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const root = 'examples/generated/united-capital-diamond';
          const manifest = JSON.parse(await readFile(`${root}/generation-manifest.json`, 'utf8'));
          const concordance = JSON.parse(await readFile(`${root}/concordance.json`, 'utf8'));
          const docx = JSON.parse(await readFile(`${root}/docx-manifest.json`, 'utf8'));
          const render = JSON.parse(await readFile(`${root}/render-manifest.json`, 'utf8'));
          const catalog = JSON.parse(await readFile('regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json', 'utf8'));
          const api = JSON.parse(await readFile('regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json', 'utf8'));
          if (concordance.length !== 62) throw new Error(`Expected 62 requirements, got ${concordance.length}`);
          if (manifest.coverage_counts.MISSING !== 0) throw new Error(`Expected MISSING=0, got ${manifest.coverage_counts.MISSING}`);
          if (manifest.ready_for_submission !== false || docx.ready_for_submission !== false) {
            throw new Error('ready_for_submission must remain false');
          }
          if (!Array.isArray(manifest.pending_review_requirement_ids) || manifest.pending_review_requirement_ids.length === 0) {
            throw new Error('Pending review requirements must remain explicit');
          }
          if (docx.component_count !== manifest.component_count) {
            throw new Error(`DOCX traceability mismatch: ${docx.component_count} vs ${manifest.component_count}`);
          }
          if (render.page_count !== 10) throw new Error(`Expected 10 rendered pages, got ${render.page_count}`);
          if (catalog.status !== 'PASS' || catalog.requirementCount !== 62) {
            throw new Error('Regulatory web catalog validation failed');
          }
          if (api.status !== 'PASS' || api.checks.readyForSubmissionRemainsFalse !== true) {
            throw new Error('Web API integration validation failed');
          }
          NODE

      - name: Check textual integrity
        run: git diff --check

      - name: Upload DOCX visual review bundle
        uses: actions/upload-artifact@v4
        with:
          name: united-capital-diamond-docx-review
          if-no-files-found: error
          retention-days: 14
          path: |
            examples/generated/united-capital-diamond/prospectus-draft.docx
            examples/generated/united-capital-diamond/docx-manifest.json
            examples/generated/united-capital-diamond/prospectus-draft.pdf
            examples/generated/united-capital-diamond/render-manifest.json
            examples/generated/united-capital-diamond/rendered-pages/*.png
            examples/generated/united-capital-diamond/generation-manifest.json
            examples/generated/united-capital-diamond/concordance.json
            regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json
            regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json

      - name: Commit generated evidence and documentation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md IMPLEMENTATION.md STATUS.md LOOP_STATE.md CURRENT_ITERATION.md \
            WORK_LOG.md SUIVI.md TODO.md CHANGELOG.md HANDOFF.md NEXT_ACTION.md \
            docs/ARCHITECTURE.md docs/PROSPECTUS_ENGINE_SPEC.md \
            docs/04-development/NEXTJS_ATOMIC_DESIGN.md apps/web/README.md \
            regulatory/validation/CIRC005_WEB_CATALOG_VALIDATION.json \
            regulatory/validation/CIRC005_WEB_API_INTEGRATION_VALIDATION.json \
            examples/generated/united-capital-diamond/prospectus-draft.md \
            examples/generated/united-capital-diamond/canonical-data.json \
            examples/generated/united-capital-diamond/questionnaire-state.json \
            examples/generated/united-capital-diamond/control-report.json \
            examples/generated/united-capital-diamond/concordance.json \
            examples/generated/united-capital-diamond/document-model.json \
            examples/generated/united-capital-diamond/answer-log.json \
            examples/generated/united-capital-diamond/generation-manifest.json \
            examples/generated/united-capital-diamond/prospectus-draft.docx \
            examples/generated/united-capital-diamond/docx-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore: refresh regulatory catalog and generation evidence'
            git push origin HEAD:main
          fi
