name: Regulatory Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-bootstrap-main
  cancel-in-progress: false

jobs:
  apply-source-set:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and apply source set
        run: node scripts/bootstrap-regulatory-catalog-integration.mjs

      - name: Commit canonical catalog integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/ci.yml
          git add package.json apps/web
          git add -A scripts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: connect Next.js to canonical CIRC005 catalog'
            git push origin HEAD:main
          fi
