name: Discover UEMOA Robots Sitemap Surface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-uemoa-robots-sitemap.yml
      - scripts/discover_uemoa_robots_sitemap.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uemoa-robots-sitemap-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect robots-declared sitemap surface
        run: python3 scripts/discover_uemoa_robots_sitemap.py
      - name: Validate discovery boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json').read_text())
          v=json.loads(Path('regulatory/validation/UEMOA_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json').read_text())
          assert e['result']=='PASS' and v['result']=='PASS'
          for k in ['robotsOnlyEntryPoint','declaredSitemapsOnly','maxDeclaredSitemapsFive','childSitemapsNotFetched','linkedDocumentsNotFetched','binaryNotMaterialized','automaticRelationshipInferenceForbidden','automaticSanctionActivationForbidden','readyForSubmissionFalse']:
              assert v['checks'][k] is True,k
          PY
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: uemoa-robots-sitemap
          retention-days: 30
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json
            regulatory/validation/UEMOA_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json
      - name: Persist sitemap evidence
        run: |
          git config user.name 'regulatory-source-bot'
          git config user.email 'regulatory-source-bot@users.noreply.github.com'
          git add regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_ROBOTS_SITEMAP_DISCOVERY_2026-09-22.json regulatory/validation/UEMOA_ROBOTS_SITEMAP_DISCOVERY_VALIDATION_V0_1.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist UEMOA robots sitemap evidence'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
