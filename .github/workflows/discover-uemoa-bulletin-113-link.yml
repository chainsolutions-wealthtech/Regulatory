name: Discover UEMOA Bulletin 113 Link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-uemoa-bulletin-113-link.yml
      - scripts/discover_uemoa_bulletin_113_link.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uemoa-bulletin-113-link-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover exact Bulletin 113 anchor
        run: python3 scripts/discover_uemoa_bulletin_113_link.py
      - name: Validate read-only boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_BULLETIN_113_LINK_DISCOVERY_2026-09-22.json').read_text())
          v=json.loads(Path('regulatory/validation/UEMOA_BULLETIN_113_LINK_DISCOVERY_VALIDATION_V0_1.json').read_text())
          assert e['result']=='PASS' and v['result']=='PASS'
          for k in ['singleKnownOfficialPageOnly','verifiedTlsOnly','targetLinksNotFollowed','binaryNotMaterialized','workflowRepositoryWriteDisabled','automaticRelationshipInferenceForbidden','automaticSanctionActivationForbidden','readyForSubmissionFalse']:
              assert v['checks'][k] is True,k
          PY
      - run: git diff --check
      - name: Emit evidence to workflow log
        run: |
          echo '=== UEMOA_BULLETIN_113_LINK_EVIDENCE ==='
          cat regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_BULLETIN_113_LINK_DISCOVERY_2026-09-22.json
          echo '=== UEMOA_BULLETIN_113_LINK_VALIDATION ==='
          cat regulatory/validation/UEMOA_BULLETIN_113_LINK_DISCOVERY_VALIDATION_V0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: uemoa-bulletin-113-link
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_BULLETIN_113_LINK_DISCOVERY_2026-09-22.json
            regulatory/validation/UEMOA_BULLETIN_113_LINK_DISCOVERY_VALIDATION_V0_1.json
