name: Validate BCEAO Search Semantics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-bceao-search-semantics.yml
      - scripts/validate_bceao_search_semantics.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bceao-search-semantics-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test BCEAO positive and negative witnesses
        run: python3 scripts/validate_bceao_search_semantics.py
      - name: Validate fail-closed boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_SEARCH_SEMANTICS_VALIDATION_2026-09-22.json').read_text())
          v=json.loads(Path('regulatory/validation/BCEAO_SEARCH_SEMANTICS_VALIDATION_V0_1.json').read_text())
          assert e['result']=='PASS' and v['result']=='PASS'
          for k in ['exactlyThreeQueries','positiveWitnessTested','negativeSentinelTested','resultLinksNotFollowed','binaryNotMaterialized','workflowRepositoryWriteDisabled','automaticRelationshipInferenceForbidden','automaticSanctionActivationForbidden','readyForSubmissionFalse']:
              assert v['checks'][k] is True,k
          PY
      - run: git diff --check
      - name: Emit evidence to workflow log
        run: |
          echo '=== BCEAO_SEARCH_SEMANTICS_EVIDENCE ==='
          cat regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_SEARCH_SEMANTICS_VALIDATION_2026-09-22.json
          echo '=== BCEAO_SEARCH_SEMANTICS_VALIDATION ==='
          cat regulatory/validation/BCEAO_SEARCH_SEMANTICS_VALIDATION_V0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bceao-search-semantics
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/BCEAO_SEARCH_SEMANTICS_VALIDATION_2026-09-22.json
            regulatory/validation/BCEAO_SEARCH_SEMANTICS_VALIDATION_V0_1.json
