name: Probe AMF-UMOA Regulatory Category API

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_amf_umoa_regulatory_categories.py'
      - '.github/workflows/probe-amf-umoa-regulatory-categories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe witness-validated regulatory category lists
        run: python3 scripts/probe_amf_umoa_regulatory_categories.py
      - name: Validate safety boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('regulatory/registries/AMF_UMOA_REGULATORY_CATEGORY_API_REGISTRY_V0_1.json').read_text())
          v=json.loads(Path('regulatory/validation/AMF_UMOA_REGULATORY_CATEGORY_API_VALIDATION_V0_1.json').read_text())
          assert v['result']=='PASS'
          assert r['witness']['circulaire010Present']
          assert r['witness']['circulaire013Present']
          assert r['boundary']['listMetadataIsLegalStatusProof'] is False
          assert r['boundary']['automaticDependencyResolutionAllowed'] is False
          assert r['boundary']['readyForSubmissionMustRemainFalse'] is True
          print('AMF-UMOA category API witness/safety: PASS')
          PY
      - name: Commit category registry
        run: |
          if git status --porcelain -- regulatory/registries/AMF_UMOA_REGULATORY_CATEGORY_API_REGISTRY_V0_1.json regulatory/validation/AMF_UMOA_REGULATORY_CATEGORY_API_VALIDATION_V0_1.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add regulatory/registries/AMF_UMOA_REGULATORY_CATEGORY_API_REGISTRY_V0_1.json regulatory/validation/AMF_UMOA_REGULATORY_CATEGORY_API_VALIDATION_V0_1.json
            git commit -m 'regulatory: inventory AMF-UMOA instructions and decisions from official API'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
