name: Build INST066 to AMF-UMOA 2022 Circular Candidate Matrix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_inst066_2022_circular_candidate_matrix.py'
      - '.github/workflows/build-inst066-2022-circular-candidate-matrix.yml'
      - 'regulatory/registries/INST066_EXTERNAL_DEPENDENCY_RESEARCH_QUEUE_V0_1.json'
      - 'regulatory/registries/AMF_UMOA_2022_CIRCULAR_METADATA_CATALOG_V0_1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate research matrix
        run: python3 scripts/build_inst066_2022_circular_candidate_matrix.py
      - name: Validate non-resolution boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_V0_1.json').read_text())
          v=json.loads(Path('regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_VALIDATION_V0_1.json').read_text())
          assert v['result']=='PASS'
          assert m['summary']['dependencyCount']==49
          assert m['summary']['circularDependencyCount']==34
          assert v['checks']['nonCircularRowsHaveNoCircularCandidates']
          assert v['checks']['noResolvedStatusIntroduced']
          assert m['boundary']['candidateIsResolution'] is False
          assert m['boundary']['automaticDependencyResolutionAllowed'] is False
          print('INST066/2022 circular candidate matrix safety: PASS')
          PY
      - name: Commit candidate matrix
        run: |
          if git status --porcelain -- regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_V0_1.json regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_VALIDATION_V0_1.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_V0_1.json regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CANDIDATE_MATRIX_VALIDATION_V0_1.json
            git commit -m 'regulatory: build INST066 to 2022 circular candidate matrix'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
