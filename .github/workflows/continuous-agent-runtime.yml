name: Continuous Agent Runtime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Regulatory CI
      - Runtime Quality CI
      - Security and Review Policy CI
      - Browser and Accessibility CI
    types:
      - completed

concurrency:
  group: regulatory-continuous-agent-runtime
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      needs_write: ${{ steps.plan.outputs.needs_write }}
      needs_session: ${{ steps.plan.outputs.needs_session }}
      task_id: ${{ steps.plan.outputs.task_id }}
      base_head: ${{ steps.plan.outputs.base_head }}
      material_head: ${{ steps.plan.outputs.material_head }}
      attempt: ${{ steps.plan.outputs.attempt }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 40
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build session-driven execution plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/continuous-agent-runtime.mjs plan

      - name: Publish ChatGPT session readiness
        if: steps.plan.outputs.needs_session == 'true'
        shell: bash
        run: |
          echo "::notice title=ChatGPT subscription session required::Task ${{ steps.plan.outputs.task_id }} is ready. Execute it from ChatGPT with the connected GitHub surface; no OpenAI API/Codex job will be started."

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: continuous-agent-plan-${{ github.run_id }}
          path: continuous-agent-plan.json
          retention-days: 14

      - name: Summarize plan
        shell: bash
        run: |
          {
            echo "# Continuous Agent Runtime — session-driven V2"
            echo ""
            echo "- Mode: **${{ steps.plan.outputs.mode }}**"
            echo "- Reason: ${{ steps.plan.outputs.reason }}"
            echo "- Task: ${{ steps.plan.outputs.task_id || 'none' }}"
            echo "- Base HEAD: ${{ steps.plan.outputs.base_head }}"
            echo "- Material HEAD: ${{ steps.plan.outputs.material_head }}"
            echo "- ChatGPT session required: ${{ steps.plan.outputs.needs_session }}"
            echo "- Paid OpenAI API invocation: **disabled**"
          } >> "$GITHUB_STEP_SUMMARY"

  claim:
    needs: plan
    if: needs.plan.outputs.mode == 'RECONCILE' && needs.plan.outputs.needs_write == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      claim_reason: ${{ steps.claim.outputs.claim_reason }}
      worker_id: ${{ steps.worker.outputs.worker_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 10
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: continuous-agent-plan-${{ github.run_id }}

      - name: Derive state-only worker identity
        id: worker
        shell: bash
        run: echo "worker_id=gha-state:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Claim writer lease for state-only reconciliation
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ID: ${{ steps.worker.outputs.worker_id }}
          CONTINUOUS_AGENT_PLAN: continuous-agent-plan.json
        run: node scripts/continuous-agent-runtime.mjs claim

  reconcile:
    needs: [plan, claim]
    if: needs.plan.outputs.mode == 'RECONCILE' && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      completed_head: ${{ steps.commit.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 40

      - uses: actions/download-artifact@v4
        with:
          name: continuous-agent-plan-${{ github.run_id }}

      - name: Verify write lease base HEAD
        shell: bash
        run: |
          CURRENT="$(git rev-parse HEAD)"
          if [ "$CURRENT" != "${{ needs.plan.outputs.base_head }}" ]; then
            echo "::error title=Continuous Agent head diverged::Expected ${{ needs.plan.outputs.base_head }}, found $CURRENT"
            exit 1
          fi

      - name: Reconcile checkpoint and runtime state
        env:
          CONTINUOUS_AGENT_PLAN: continuous-agent-plan.json
        run: node scripts/continuous-agent-runtime.mjs reconcile

      - name: Commit state-only reconciliation
        id: commit
        shell: bash
        run: |
          git config user.name "regulatory-continuity[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/agent-runtime/STATE.json ops/continuity/CHECKPOINT.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: continuous agent checkpoint (${{ needs.plan.outputs.task_id }})"
          git push origin HEAD:main
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan, claim, reconcile]
    if: always() && needs.claim.result == 'success' && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Release state-only writer lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ID: ${{ needs.claim.outputs.worker_id }}
          TASK_ID: ${{ needs.plan.outputs.task_id }}
          COMPLETED_HEAD: ${{ needs.reconcile.outputs.completed_head || needs.plan.outputs.base_head }}
          OUTCOME: ${{ needs.reconcile.result == 'success' && 'RECONCILED' || 'STATE_RECONCILIATION_FAILED' }}
        run: node scripts/continuous-agent-runtime.mjs release
