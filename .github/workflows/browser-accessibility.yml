name: Browser and Accessibility CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulatory-browser-accessibility-main
  cancel-in-progress: true

jobs:
  browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install application dependencies
        run: npm run web:install

      - name: Generate regulatory catalog
        run: npm run generate:web-catalog

      - name: Typecheck application
        run: npm run web:typecheck

      - name: Build application
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          REGULATORY_STORAGE_DRIVER: local-json

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser and automated accessibility tests
        run: npm --prefix apps/web run test:e2e
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          REGULATORY_STORAGE_DRIVER: local-json

      - name: Upload browser accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            regulatory/validation/WEB_BROWSER_ACCESSIBILITY_VALIDATION.json
            apps/web/playwright-report/
            apps/web/test-results/
