name: Discover UEMOA CM-10-06-2022 Exact Search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-uemoa-cm-10-06-2022-exact-search.yml
      - scripts/discover_uemoa_cm_10_06_2022_exact_search.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uemoa-cm-10-06-2022-exact-search-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit bounded exact searches to UEMOA
        run: python3 scripts/discover_uemoa_cm_10_06_2022_exact_search.py
      - name: Validate safety boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_EXACT_SEARCH_DISCOVERY_2026-09-22.json').read_text())
          v=json.loads(Path('regulatory/validation/UEMOA_EXACT_SEARCH_DISCOVERY_VALIDATION_V0_1.json').read_text())
          assert e['result']=='PASS' and v['result']=='PASS'
          for k in ['authoritativeSearchOnly','queryCountExactlyThree','resultLinksNotFollowed','binaryNotMaterialized','automaticRelationshipInferenceForbidden','automaticSanctionActivationForbidden','readyForSubmissionFalse']:
              assert v['checks'][k] is True,k
          PY
      - name: Check textual integrity
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: uemoa-cm-10-06-2022-exact-search
          retention-days: 30
          if-no-files-found: error
          path: |
            regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_EXACT_SEARCH_DISCOVERY_2026-09-22.json
            regulatory/validation/UEMOA_EXACT_SEARCH_DISCOVERY_VALIDATION_V0_1.json
      - name: Commit generated discovery evidence
        run: |
          git config user.name 'regulatory-source-bot'
          git config user.email 'regulatory-source-bot@users.noreply.github.com'
          git add             regulatory/review-evidence/SANCTIONS_2016_2022/UEMOA_EXACT_SEARCH_DISCOVERY_2026-09-22.json             regulatory/validation/UEMOA_EXACT_SEARCH_DISCOVERY_VALIDATION_V0_1.json
          if git diff --cached --quiet; then
            echo 'No UEMOA exact search evidence changes to commit.'
          else
            git commit -m 'chore: persist UEMOA exact sanctions search evidence'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
