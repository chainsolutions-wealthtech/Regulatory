name: Build INST066 Circular Content Scope Matrix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_inst066_circular_content_scope_matrix.py'
      - '.github/workflows/build-inst066-circular-content-scope-matrix.yml'
      - 'regulatory/registries/INST066_CIRCULAR_DEPENDENCY_REVIEW_DIGEST_V0_1.json'
      - 'regulatory/registries/AMF_UMOA_2022_CIRCULAR_CATALOG_V0_1.json'
      - 'regulatory/sources/amf-umoa-2022-circulars/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build curated content-scope matrix
        run: python3 scripts/build_inst066_circular_content_scope_matrix.py
      - name: Validate non-resolution boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_V0_1.json').read_text())
          v=json.loads(Path('regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_VALIDATION_V0_1.json').read_text())
          assert v['result']=='PASS'
          assert m['summary']['dependencyCount']==34
          assert m['summary']['matchedStrongOrExact']==26
          assert m['summary']['relatedOnly']==2
          assert m['summary']['noConfirmedMatch']==6
          assert all(r['resolved'] is False for r in m['rows'])
          assert m['boundary']['automaticDependencyResolutionAllowed'] is False
          assert m['boundary']['automaticRequirementActivationAllowed'] is False
          print('INST066 circular content-scope matrix invariants: PASS')
          PY
      - name: Commit content-scope matrix
        run: |
          if git status --porcelain -- regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_V0_1.json regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_VALIDATION_V0_1.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add regulatory/registries/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_V0_1.json regulatory/validation/INST066_TO_AMF_UMOA_2022_CIRCULAR_CONTENT_SCOPE_MATRIX_VALIDATION_V0_1.json
            git commit -m 'regulatory: build INST066 circular content-scope matrix'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
