name: Materialize AMF-UMOA 2022 OPC Circular Registry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize_amf_umoa_2022_opc_circular_registry.py'
      - '.github/workflows/materialize-amf-umoa-2022-opc-circular-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Materialize official report and registry
        run: python3 scripts/materialize_amf_umoa_2022_opc_circular_registry.py
      - name: Validate registry invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('regulatory/registries/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_V0_1.json').read_text())
          v=json.loads(Path('regulatory/validation/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_VALIDATION_V0_1.json').read_text())
          assert r['expectedCircularCount']==16
          assert r['detectedCircularCount']==16
          assert r['missingCircularNumbers']==[]
          assert len(r['entries'])==16
          assert [x['number'] for x in r['entries']]==list(range(1,17))
          assert all(x['individualBinaryStatus']=='TO_MATERIALIZE_AND_COMPARE' for x in r['entries'])
          assert r['boundary']['automaticDependencyResolutionAllowed'] is False
          assert r['boundary']['automaticRequirementActivationAllowed'] is False
          assert v['result']=='PASS'
          print('AMF-UMOA 2022 OPC circular registry invariants: PASS')
          PY
      - name: Commit generated official-source artifacts
        run: |
          if git diff --quiet -- regulatory/sources/amf-umoa-2022-report regulatory/registries/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_V0_1.json regulatory/validation/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_VALIDATION_V0_1.json; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regulatory/sources/amf-umoa-2022-report regulatory/registries/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_V0_1.json regulatory/validation/AMF_UMOA_2022_OPC_CIRCULARS_REGISTRY_VALIDATION_V0_1.json
          git commit -m 'regulatory: materialize AMF-UMOA 2022 OPC circular registry'
          git pull --rebase origin main
          git push origin HEAD:main
