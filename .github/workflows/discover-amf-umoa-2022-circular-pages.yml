name: Discover AMF-UMOA 2022 Circular Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_amf_umoa_2022_circular_pages.py'
      - '.github/workflows/discover-amf-umoa-2022-circular-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover official pages and binaries
        run: python3 scripts/discover_amf_umoa_2022_circular_pages.py
      - name: Validate discovery boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('regulatory/registries/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_V0_1.json')
          v=Path('regulatory/validation/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_VALIDATION_V0_1.json')
          r=json.loads(p.read_text())
          z=json.loads(v.read_text())
          assert z['result']=='PASS'
          assert z['checks']['knownCircular010Recovered']
          assert z['checks']['knownCircular013Recovered']
          assert r['boundary']['pageIdImpliesRegulatoryNumber'] is False
          assert r['boundary']['automaticDependencyResolutionAllowed'] is False
          print('AMF-UMOA official circular page discovery boundary: PASS')
          PY
      - name: Commit discovery artifacts
        run: |
          if git status --porcelain -- regulatory/registries/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_V0_1.json regulatory/validation/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_VALIDATION_V0_1.json regulatory/sources/amf-umoa-2022-circulars | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add regulatory/registries/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_V0_1.json regulatory/validation/AMF_UMOA_2022_CIRCULAR_OFFICIAL_PAGES_VALIDATION_V0_1.json regulatory/sources/amf-umoa-2022-circulars 2>/dev/null || true
            git commit -m 'regulatory: discover official AMF-UMOA 2022 circular pages'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No discovery changes to commit.'
          fi
